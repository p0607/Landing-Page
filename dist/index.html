gin:50% 100%;animation:flame .9s ease-in-out var(--dl,0s) infinite alternate}.dg{animation:dglow 2.2s ease-in-out var(--dl,0s) infinite alternate}@media (prefers-reduced-motion:reduce){*,:before,:after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0s!important}.base{stroke-dashoffset:0}}:root{--acc-rgb:255,176,48;--pumpkin:#ffb030;--ember:#ffe28a;--spectral:#ffd86b;--bg-top:#6a1240;--bg-br:255,100,40;--bg-bl:200,30,130;--bg-1:#2c0722;--bg-2:#1d0418;--bg-3:#0f020c;--moon-1:#fffbe8;--moon-2:#ffeab0;--moon-3:#ffc66a;--moon-4:#e48a3c;--moon-glow:255,196,100;--moon-glow2:255,90,130;--ray-rgb:255,205,130;--moon-shade:150,70,20;--cloud-rgb:44,6,32;--logo-1:#fff0b0;--logo-2:#ffb030;--logo-3:#fff;--logo-4:#ff7a3d;--logo-5:#ff3d8b;--tag-color:#ffe2a8;--panel-a:64,12,46;--panel-b:32,5,26;--card-a:80,16,56;--card-b:32,5,26;--hill-far-a:#4a0d34;--hill-far-b:#1d0418;--hill-near:#12030f;--hill-stone:#2a0820;--tree:#12030f;--web:#ffd27a;--fog1:255,120,60;--fog2:255,60,140;--fog3:255,200,80;--lantern:255,170,70}.moon{animation-duration:10s}</style>

<script>
(() => {
'use strict';
const NS='http://www.w3.org/2000/svg';
const $=s=>document.querySelector(s);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const rnd=(a,b)=>a+Math.random()*(b-a);

/* =====================================================================
   1 · DATA  — 5-step flow + autonomous AI node with configured portal URLs
   ===================================================================== */
const ICONS={
  diya:`<svg viewBox="0 0 24 24"><path d="M2.8 13.2c0 4 4 7 9.2 7s9.2-3 9.2-7z"/><path d="M12 3c-2.2 2.6-3 4.4-3 6a3 3 0 0 0 6 0c0-1.6-.8-3.4-3-6z"/><path d="M12 10v3"/></svg>`,
  dandiya:`<svg viewBox="0 0 24 24"><path d="M5 19.5L17.2 5M19 19.5L6.8 5"/><circle cx="17.9" cy="4.2" r="1.3"/><circle cx="6.1" cy="4.2" r="1.3"/><path d="M8.6 13.4l2.2 1.8M15.4 13.4l-2.2 1.8M4.2 20.6l1.4-1.4M19.8 20.6l-1.4-1.4"/></svg>`,
  mandala:`<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.1"/><circle cx="12" cy="12" r="9.6"/><path d="M12 3.6c2 2.6 2 4.8 0 6.8-2-2-2-4.2 0-6.8zM12 20.4c2-2.6 2-4.8 0-6.8-2 2-2 4.2 0 6.8zM3.6 12c2.6-2 4.8-2 6.8 0-2 2-4.2 2-6.8 0zM20.4 12c-2.6-2-4.8-2-6.8 0 2 2 4.2 2 6.8 0z"/><g transform="rotate(45 12 12)"><path d="M12 5c1.4 1.8 1.4 3.4 0 4.8-1.4-1.4-1.4-3 0-4.8zM12 19c1.4-1.8 1.4-3.4 0-4.8-1.4 1.4-1.4 3 0 4.8zM5 12c1.8-1.4 3.4-1.4 4.8 0-1.4 1.4-3 1.4-4.8 0zM19 12c-1.8-1.4-3.4-1.4-4.8 0 1.4 1.4 3 1.4 4.8 0z"/></g></svg>`,
  kalash:`<svg viewBox="0 0 24 24"><path d="M7.5 10.5c-1.8 1.6-2.4 3.4-2.4 5.2 0 2.6 2.7 4.3 6.9 4.3s6.9-1.7 6.9-4.3c0-1.8-.6-3.6-2.4-5.2z"/><path d="M9 10.5V9h6v1.5"/><path d="M12 3.2c2.4 0 3.9 1.6 3.9 3.5S14 9 12 9 8.1 8.6 8.1 6.7 9.6 3.2 12 3.2z"/><path d="M8.3 6.2C6.6 5.4 5.4 5.9 4.6 7M15.7 6.2c1.7-.8 2.9-.3 3.7.8M5.5 14.5h13"/></svg>`,
  lotus:`<svg viewBox="0 0 24 24"><path d="M12 4c2.4 2.6 3.2 5.6 0 9.5C8.8 9.6 9.6 6.6 12 4z"/><path d="M6 8c3.2.2 5.2 2.4 6 5.6-3.4.6-6-.9-6-5.6zM18 8c-3.2.2-5.2 2.4-6 5.6 3.4.6 6-.9 6-5.6z"/><path d="M2.6 11.5c2.8.5 5 2.8 5.6 6.2-3.5-.5-5.8-2.8-5.6-6.2zM21.4 11.5c-2.8.5-5 2.8-5.6 6.2 3.5-.5 5.8-2.8 5.6-6.2z"/><path d="M7 19.6c3.2 1.1 6.8 1.1 10 0"/></svg>`,
  matrix:`<svg viewBox="0 0 24 24"><circle cx="12" cy="10.5" r="6.6"/><path d="M7 19.6h10M8.6 17.1l-1.3 2.5M15.4 17.1l1.3 2.5"/><path class="sp" d="M12 6.9l.95 2.3 2.35.95-2.35.95L12 13.4l-.95-2.3-2.35-.95 2.35-.95z"/></svg>`
};
const nodes=[
  {id:'crm',       n:'1', x:0,    y:0,   c:'#ffb020', icon:'diya',    cls:'diya',    t:'CRM',           d:'Prospects and pipeline',        tag:'+18.4%',     url:'https://q9lab.in/crm/login'},
  {id:'clients',   n:'2', x:330,  y:175, c:'#ff5fa2', icon:'dandiya', cls:'dandiya', t:'Client Module', d:'Client accounts and contacts',  tag:'99.98%',     url:'https://q9lab.in/cms/login'},
  {id:'alchemflow',n:'3', x:662,  y:0,   c:'#ff7a3d', icon:'mandala', cls:'mandala', t:'Alchemflow',    d:'Vendors and applicants',        tag:'Live Flow',  url:'https://q9lab.in/vms/'},
  {id:'hrms',      n:'4', x:995,  y:175, c:'#c77dff', icon:'kalash',  cls:'kalash',  t:'HRMS',          d:'People and HR ops',             tag:'Global',     url:'https://q9lab.in/hrms/login'},
  {id:'financials',n:'5', x:1325, y:0,   c:'#ffe07a', icon:'lotus',   cls:'lotus',   t:'Financials',    d:'Billing and books',             tag:'Realtime',   url:'https://q9lab.in/vendormanagement/#/HomePage'},
  {id:'matrix',    n:'AI',x:662,  y:350, c:'#4de0d0', icon:'matrix',  cls:'matrix',  t:'Matrix',        d:'Team insights',                 tag:'Autonomous', url:'http://20.244.92.198/COSEC/Login/Login', ai:true}
];
const W=285,H=98;
const T={ember:'255,190,80',wisps:['255,170,60','255,90,140','255,210,100','255,120,60'],wispN:22,wispA:1.1,stars:['#fff','#ffe6a8','#ffc0d8'],bats:7,emberN:1.1,emberMul:1,flash:'#ffd27a'};

/* =====================================================================
   2 · SOUND  (tiny WebAudio chimes, off until first gesture)
   ===================================================================== */
let ac=null,sfxOn=true;
const sfxBtn=$('#sfx'),sfxLabel=$('#sfxLabel');
function ctx(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac}catch(e){return null}}
function tone(f,dur,type='sine',vol=.04,delay=0,slideTo){
  if(!sfxOn)return;const a=ctx();if(!a||a.state!=='running')return;
  const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+delay;
  o.type=type;o.frequency.setValueAtTime(f,t);if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.05);
}
const hoverChime=i=>{const b=[392,440,494,523,587,330][i]||440;tone(b,.5,'sine',.035);tone(b*1.5,.6,'triangle',.018,.05)};
const clickThud=()=>{tone(120,.35,'sine',.09,0,45);tone(660,.25,'triangle',.02,.02)};
if(sfxBtn){
  sfxBtn.addEventListener('click',()=>{
    sfxOn=!sfxOn;sfxBtn.setAttribute('aria-pressed',sfxOn);if(sfxLabel)sfxLabel.textContent=sfxOn?'SFX ON':'SFX OFF';
    if(sfxOn){ctx();tone(523,.3,'sine',.05);tone(784,.4,'triangle',.03,.08)}
  });
}
addEventListener('pointerdown',()=>ctx(),{once:true});

/* =====================================================================
   3 · STAGE  — nodes, connectors, interactions
   ===================================================================== */
const stage=$('#stage'),links=$('#links');
const slots=nodes.map((o,i)=>{
  const s=document.createElement('div');s.className='slot';
  s.style.cssText=`left:${o.x}px;top:${o.y}px;--c:${o.c};--d:${(.75+i*.14).toFixed(2)}s`;
  const isExt = Boolean(o.url);
  s.innerHTML=`<a class="node${o.ai?' ai':''}" href="${o.url || '#' + o.id}" ${isExt ? 'target="_blank" rel="noopener noreferrer"' : ''} aria-label="${o.t} — ${o.d}">
    <span class="spot"></span><span class="scan"></span>${o.ai?'<span class="aura"></span><span class="aura b"></span>':''}
    <span class="num${o.ai?' ai':''}">${o.n}</span><span class="tag">${o.tag}</span>
    <span class="ico ${o.cls}">${ICONS[o.icon]}</span>
    <span class="txt"><span class="t">${o.t}</span><span class="d">${o.d}</span></span>
    <span class="corner"></span></a>`;
  stage.appendChild(s);
  const node=s.firstElementChild;
  s.addEventListener('pointerenter',()=>hoverChime(i));
  s.addEventListener('pointermove',e=>{
    const r=node.getBoundingClientRect(),px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height;
    node.style.setProperty('--px',(px*100)+'%');node.style.setProperty('--py',(py*100)+'%');
    node.style.transform=`perspective(900px) rotateY(${((px-.5)*11).toFixed(2)}deg) rotateX(${((.5-py)*9).toFixed(2)}deg) translateZ(0)`;
  });
  s.addEventListener('pointerleave',()=>{node.style.transform=''});
  node.addEventListener('click',e=>{
    clickThud();
    const r=node.getBoundingClientRect(),k=r.width/W,rp=document.createElement('span');
    rp.className='ripple';rp.style.left=((e.clientX-r.left)/k)+'px';rp.style.top=((e.clientY-r.top)/k)+'px';
    node.querySelector('.scan').appendChild(rp);setTimeout(()=>rp.remove(),900);
    dispatchEvent(new CustomEvent('module:open',{detail:o}));
    if(!o.url){
      e.preventDefault();
    }
  });
  return s;
});

/* connectors 1→2→3→4→5 */
const el=(n,a={},p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);p&&p.appendChild(e);return e};
function buildLinks(fast){
  const defs=links.querySelector('defs');
  [...links.children].forEach(c=>{if(c!==defs)c.remove()});
  defs.querySelectorAll('linearGradient').forEach(g=>g.remove());
  const now=links.getCurrentTime?links.getCurrentTime():0;
  for(let i=0;i<4;i++){
    const a=nodes[i],b=nodes[i+1],x1=a.x+W,y1=a.y+H/2,x2=b.x,y2=b.y+H/2,mx=(x1+x2)/2;
    const d=`M${x1} ${y1}C${mx+14} ${y1} ${mx-14} ${y2} ${x2} ${y2}`,dd=(fast?.15+i*.18:1.35+i*.28).toFixed(2)+'s';
    const gid='lg'+i,g=el('linearGradient',{id:gid,gradientUnits:'userSpaceOnUse',x1,y1:0,x2,y2:0},defs);
    el('stop',{offset:0,'stop-color':a.c},g);el('stop',{offset:1,'stop-color':b.c},g);
    const grp=el('g',{style:`--dd:${dd}`},links);
    el('path',{d,class:'glowp',stroke:`url(#${gid})`},grp);
    el('path',{d,class:'base',pathLength:1,stroke:`url(#${gid})`},grp);
    el('path',{d,class:'flow',stroke:'#fff'},grp).style.stroke=`url(#${gid})`;
    const pid='cp'+i;el('path',{d,id:pid,fill:'none'},grp);
    const st=el('g',{class:'port',transform:`translate(${x1} ${y1})`},grp);
    el('circle',{r:4,fill:'#0b0415',stroke:a.c,'stroke-width':1.6},st);
    const pr=el('circle',{r:4,fill:'none',stroke:a.c,'stroke-width':1},st);
    pr.innerHTML=`<animate attributeName="r" values="4;15" dur="2.6s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0" dur="2.6s" repeatCount="indefinite"/>`;
    const en=el('g',{class:'port',transform:`translate(${x2} ${y2})`},grp);
    el('path',{d:'M-9 -7L1 0L-9 7',fill:'none',stroke:b.c,'stroke-width':2.2,'stroke-linecap':'round','stroke-linejoin':'round',filter:'url(#orbglow)'},en);
    const t0=now+(fast?.8+i*.3:2.2+i*.55),dur=(3.2+i*.35).toFixed(2);
    [[4.6,'#fff7e6',0,1],[3.2,b.c,.11,.8],[2.0,b.c,.22,.55]].forEach(([r,fill,off,op])=>{
      const c=el('circle',{r,fill,opacity:0,filter:'url(#orbglow)'},grp),bt=(t0+off).toFixed(2);
      c.innerHTML=`<set attributeName="opacity" to="${op}" begin="${bt}s"/>
        <animateMotion dur="${dur}s" begin="${bt}s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="spline" keySplines=".45 0 .55 1"><mpath href="#${pid}"/></animateMotion>`;
    });
  }
}
buildLinks(false);

/* fit the 1610×470 stage into whatever room the layout leaves */
const wrap=$('.stagewrap');
function fit(){
  const r=wrap.getBoundingClientRect();
  stage.style.setProperty('--k',Math.max(.4,Math.min(1.2,r.width/1700,r.height/525)).toFixed(3));
}
addEventListener('resize',fit);fit();

/* Indian Standard Time (IST) clock */
const clk=$('#clock');
if(clk){
  const tick=()=>{
    const now=new Date();
    const t=now.toLocaleTimeString('en-GB',{timeZone:'Asia/Kolkata',hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'}).split(':');
    clk.innerHTML=`${t[0]}<span class="c">:</span>${t[1]}<span class="c">:</span>${t[2]}`;
  };
  tick();setInterval(tick,1000);
}

/* =====================================================================
   4 · PROCEDURAL SCENERY  — fractal trees + spider webs
   ===================================================================== */
function buildGarland(svg){
  const strs=[[18,150],[54,250],[92,190],[130,300],[168,220]];
  strs.forEach(([x,len],k)=>{
    const g=el('g',{},svg);g.style.transformOrigin=`${x}px 0px`;g.style.animation=`garsway ${5+k*.9}s ease-in-out ${-k}s infinite`;
    el('line',{x1:x,y1:0,x2:x,y2:len,stroke:'#8a3b12','stroke-width':1},g);
    for(let y=8,i=0;y<len;y+=13,i++){
      el('circle',{cx:x+(i%2?1.2:-1.2),cy:y,r:5.2,fill:i%3===0?'#ffd23a':'#ff9a1f',stroke:'#7a2a08','stroke-width':.5},g);
      if(i%3===1)el('circle',{cx:x,cy:y,r:1.8,fill:'#fff0a0'},g);
    }
    el('path',{d:`M${x-4} ${len}q4 10 8 0z`,fill:'#ffd86b'},g);
  });
}
buildGarland($('#webL'));buildGarland($('#webR'));

function buildMandala(svg){
  const S=el('g',{fill:'none',stroke:'#ffc15a','stroke-width':1.2},svg);
  [[12,40,100,22],[16,105,165,22],[24,170,230,18]].forEach(([n,r0,r1,w])=>{
    for(let i=0;i<n;i++)el('path',{d:`M0 ${-r0}Q${w} ${-(r0+r1)/2} 0 ${-r1}Q${-w} ${-(r0+r1)/2} 0 ${-r0}Z`,transform:`rotate(${i/n*360})`},S);
  });
  [35,100,168,236,252].forEach((r,i)=>el('circle',{r,'stroke-dasharray':i%2?'3 7':'none'},S));
}
buildMandala($('.mand'));

function buildDiyas(){
  const svg=$('.hills'),defs=svg.querySelector('defs');
  const rg=el('radialGradient',{id:'dglow'},defs);
  el('stop',{offset:0,'stop-color':'#ffcf5a','stop-opacity':.65},rg);el('stop',{offset:1,'stop-color':'#ff7a1a','stop-opacity':0},rg);
  const g=el('g',{},svg);
  for(let i=0;i<15;i++){
    const x=70+i*(1460/14),d=el('g',{transform:`translate(${x} 205)`},g);d.style.setProperty('--dl',(-(i*.37)%2).toFixed(2)+'s');
    el('circle',{r:26,cy:-9,fill:'url(#dglow)',class:'dg'},d);
    el('path',{d:'M-9 0Q0 12 9 0Z',fill:'#b4521a',stroke:'#ffcf5a','stroke-width':.8},d);
    el('path',{d:'M0 -1C-4.5 -6-1.5 -11 0 -17 1.5-11 4.5-6 0 -1Z',fill:'#ffd25a',class:'fl'},d);
    el('path',{d:'M0 -2C-2 -5-.7 -8 0 -11 .7-8 2-5 0 -2Z',fill:'#fff4c0',class:'fl'},d);
  }
}
buildDiyas();

/* =====================================================================
   5 · CANVAS ENGINE — stars, wisps, lightning (back) · embers, bats (front)
   ===================================================================== */
const bg=$('#bg'),fg=$('#fg'),bx=bg.getContext('2d'),fx=fg.getContext('2d'),flash=$('#flash');
let VW=0,VH=0,DPR=1;
function sprite(rgb,size=64,core=.9){
  const c=document.createElement('canvas');c.width=c.height=size;const g=c.getContext('2d');
  const gr=g.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
  gr.addColorStop(0,`rgba(${rgb},${core})`);gr.addColorStop(.25,`rgba(${rgb},.45)`);gr.addColorStop(1,`rgba(${rgb},0)`);
  g.fillStyle=gr;g.fillRect(0,0,size,size);return c;
}
const SP={w:[]};
function buildSprites(){SP.ember=sprite(T.ember);SP.w=T.wisps.map(c=>sprite(c,96,.7))}
let stars=[],wisps=[],embers=[],bats=[];

function seed(){
  stars=Array.from({length:Math.min(220,Math.round(VW*VH/9000))},()=>({x:rnd(0,VW),y:Math.pow(Math.random(),1.5)*VH*.7,r:rnd(.3,1.35),a:rnd(.25,.95),f:rnd(.6,2.4),p:rnd(0,6.28),c:T.stars[Math.floor(Math.random()*T.stars.length)]}));
  wisps=Array.from({length:T.wispN},(_,i)=>({s:SP.w[i%SP.w.length],bx:rnd(0,VW),by:rnd(VH*.32,VH*.92),ax:rnd(40,180),ay:rnd(20,90),sx:rnd(.4,1.1),sy:rnd(.4,1.1),p:rnd(0,6.28),size:rnd(70,170),a:rnd(.22,.5)*T.wispA}));
  embers=Array.from({length:Math.round(Math.min(90,VW/20)*T.emberN)},()=>spawnEmber(true));
  bats=Array.from({length:T.bats},()=>spawnLantern(true));
}
function resize(){
  DPR=Math.min(devicePixelRatio||1,2);VW=innerWidth;VH=innerHeight;
  [bg,fg].forEach(c=>{c.width=VW*DPR;c.height=VH*DPR});
  bx.setTransform(DPR,0,0,DPR,0,0);fx.setTransform(DPR,0,0,DPR,0,0);seed();fit();
}
addEventListener('resize',resize);

function spawnEmber(init){return{x:rnd(0,VW),y:init?rnd(0,VH):VH+rnd(0,60),vy:rnd(16,52),sw:rnd(10,38),f:rnd(.4,1.4),p:rnd(0,6.28),s:rnd(1.6,4.2),a:rnd(.5,1),life:rnd(.6,1)}}
function spawnLantern(init){return{x:rnd(0,VW),y:init?rnd(VH*.2,VH):VH+rnd(20,120),vy:rnd(14,30),sw:rnd(8,22),f:rnd(.5,1.2),p:rnd(0,6.28),s:rnd(1.6,2.8)}}

/* fireworks */
let fw=[],nextFw=performance.now()+2500;
const FWC=['255,200,70','255,100,150','255,150,60','200,120,255','255,240,170'];
function burst(){
  const x=rnd(VW*.12,VW*.88),y=rnd(VH*.1,VH*.4),c=FWC[(Math.random()*FWC.length)|0],c2=FWC[(Math.random()*FWC.length)|0],n=54;
  for(let i=0;i<n;i++){const a=i/n*6.2832+rnd(-.05,.05),sp=rnd(70,170)*(i%2?1:.62);fw.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,l:1,d:rnd(.7,1.15),c:i%2?c:c2})}
}

/* pointer state (shared by parallax + lantern) */
const ptr={x:innerWidth/2,y:innerHeight*.4,nx:0,ny:0,sx:innerWidth/2,sy:innerHeight*.4,snx:0,sny:0};
addEventListener('pointermove',e=>{ptr.x=e.clientX;ptr.y=e.clientY;ptr.nx=(e.clientX/innerWidth-.5)*2;ptr.ny=(e.clientY/innerHeight-.5)*2},{passive:true});
const par=[['#L-sky',-9],['#L-hills',7],['#L-mandala',-4],['#L-props',11],['#L-stage',-5]].map(([s,k])=>[$(s),k]);
const lantern=$('#lantern');

let last=performance.now();
function frame(t){
  const dt=Math.min(.05,(t-last)/1000);last=t;
  ptr.sx+=(ptr.x-ptr.sx)*.08;ptr.sy+=(ptr.y-ptr.sy)*.08;ptr.snx+=(ptr.nx-ptr.snx)*.05;ptr.sny+=(ptr.ny-ptr.sny)*.05;
  lantern.style.setProperty('--lx',ptr.sx+'px');lantern.style.setProperty('--ly',ptr.sy+'px');
  par.forEach(([e,k])=>e.style.transform=`translate3d(${(ptr.snx*k).toFixed(2)}px,${(ptr.sny*k*.6).toFixed(2)}px,0)`);

  /* ---- back canvas ---- */
  bx.clearRect(0,0,VW,VH);
  for(const s of stars){bx.globalAlpha=s.a*(.5+.5*Math.sin(t*.001*s.f+s.p));bx.fillStyle=s.c;bx.beginPath();bx.arc(s.x,s.y,s.r,0,6.2832);bx.fill()}
  bx.globalCompositeOperation='lighter';
  for(const w of wisps){
    const x=w.bx+Math.sin(t*.00018*w.sx+w.p)*w.ax,y=w.by+Math.cos(t*.00022*w.sy+w.p)*w.ay;
    bx.globalAlpha=w.a*(.55+.45*Math.sin(t*.0009+w.p*3));bx.drawImage(w.s,x-w.size/2,y-w.size/2,w.size,w.size);
  }
  bx.globalCompositeOperation='source-over';bx.globalAlpha=1;
  if(!reduce){
    if(t>nextFw){burst();nextFw=t+rnd(5000,10000)}
    if(fw.length){
      bx.save();bx.globalCompositeOperation='lighter';bx.lineCap='round';bx.lineWidth=2;
      for(let i=fw.length-1;i>=0;i--){
        const p=fw[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=55*dt;p.vx*=.985;p.vy*=.985;p.l-=dt/p.d;
        if(p.l<=0){fw.splice(i,1);continue}
        bx.strokeStyle=`rgba(${p.c},${Math.min(1,p.l*1.2).toFixed(2)})`;bx.beginPath();bx.moveTo(p.x-p.vx*.04,p.y-p.vy*.04);bx.lineTo(p.x,p.y);bx.stroke();
      }
      bx.restore();
    }
  }

  /* ---- front canvas ---- */
  fx.clearRect(0,0,VW,VH);
  fx.globalCompositeOperation='lighter';
  for(const e of embers){
    e.y-=e.vy*dt*T.emberMul;e.x+=Math.sin(t*.001*e.f+e.p)*e.sw*dt;e.life-=dt*.05;
    if(e.y<-20||e.life<=0){Object.assign(e,spawnEmber(false))}
    const fade=Math.min(1,(VH-e.y)/120)*Math.min(1,e.y/200+.2);
    fx.globalAlpha=Math.max(0,e.a*fade*(.6+.4*Math.sin(t*.008*e.f+e.p)))*.9;
    fx.drawImage(SP.ember,e.x-e.s*3,e.y-e.s*3,e.s*6,e.s*6);
  }
  fx.globalCompositeOperation='source-over';fx.globalAlpha=1;
  for(const b of bats){
    b.y-=b.vy*dt;b.x+=Math.sin(t*.0006*b.f+b.p)*b.sw*dt;
    if(b.y<-60)Object.assign(b,spawnLantern(false));
    const a=Math.min(1,(VH-b.y)/160)*Math.min(1,b.y/120+.3),w=7*b.s,h=10*b.s;
    fx.globalCompositeOperation='lighter';fx.globalAlpha=a*.7*(.8+.2*Math.sin(t*.004*b.f+b.p));
    fx.drawImage(SP.ember,b.x-b.s*7,b.y-b.s*7,b.s*14,b.s*14);
    fx.globalCompositeOperation='source-over';fx.globalAlpha=a*.95;
    fx.fillStyle='#ffb45a';fx.fillRect(b.x-w/2,b.y-h/2,w,h);
    fx.fillStyle='#7a2a10';fx.fillRect(b.x-w/2,b.y-h/2-1.5*b.s,w,1.5*b.s);fx.fillRect(b.x-w/2,b.y+h/2,w,1.5*b.s);
  }
  fx.globalAlpha=1;
  if(!reduce)requestAnimationFrame(frame);
}
flash.style.background=T.flash;
buildSprites();resize();
if(reduce){frame(performance.now())}else{requestAnimationFrame(frame)}
})();
</script>
</body>
