<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alchemy · Welcome to Winter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    .hero {
      flex: none;
      text-align: center;
      margin-top: 18px
    }

    .logo {
      position: relative;
      width: min(460px, 64vw);
      aspect-ratio: 1865/629;
      margin: 2px auto 0;
      animation: logofloat 7s ease-in-out 3s infinite
    }

    .logo::before {
      content: "";
      position: absolute;
      inset: -30% -12%;
      z-index: -1;
      pointer-events: none;
      border-radius: 50%;
      background: radial-gradient(closest-side, rgba(0, 102, 230, .13), rgba(0, 102, 230, .05) 55%, transparent 75%);
      animation: halo 5s ease-in-out infinite
    }

    .logo svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 4px 8px rgba(0, 102, 230, .18));
      animation: logoglow 4.5s ease-in-out 3s infinite
    }

    .logo .arcs {
      transform: translate(calc(var(--lx, 0)*14px), calc(var(--ly, 0)*10px));
      transition: transform .5s cubic-bezier(.2, .8, .2, 1)
    }

    .logo .word {
      transform: translate(calc(var(--lx, 0)*-5px), calc(var(--ly, 0)*-3px));
      transition: transform .5s cubic-bezier(.2, .8, .2, 1)
    }

    .arc {
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: arcdraw 1.5s .15s cubic-bezier(.65, 0, .25, 1) forwards
    }

    .a2 .arc {
      animation-delay: .55s
    }

    .comet {
      stroke-dasharray: .09 .91;
      stroke-dashoffset: .09;
      opacity: 0;
      animation: comet 4.2s 2.2s linear infinite
    }

    .comet.c2 {
      animation-delay: 3.4s;
      animation-direction: normal
    }

    .comet.glow {
      opacity: 0
    }

    .pulses circle {
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
      animation: ripple 3.6s var(--d) ease-out infinite
    }

    .L {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      opacity: 0;
      animation: letterin .9s calc(.55s + var(--i)*.07s) cubic-bezier(.2, 1.2, .3, 1) forwards
    }

    .bob {
      animation: bob 4.8s calc(2.4s + var(--i)*.12s) ease-in-out infinite
    }

    .sheen {
      transform: translateX(-300px) skewX(-18deg);
      animation: sheen 5.5s 2.6s ease-in-out infinite
    }

    @keyframes arcdraw {
      to {
        stroke-dashoffset: 0
      }
    }

    @keyframes comet {
      0% {
        stroke-dashoffset: .09;
        opacity: 0
      }

      6% {
        opacity: 1
      }

      55% {
        opacity: 1
      }

      62% {
        stroke-dashoffset: -1;
        opacity: 0
      }

      100% {
        stroke-dashoffset: -1;
        opacity: 0
      }
    }

    @keyframes ripple {
      0% {
        opacity: .7;
        transform: scale(.6)
      }

      70%,
      100% {
        opacity: 0;
        transform: scale(3.4)
      }
    }

    @keyframes letterin {
      0% {
        opacity: 0;
        transform: translateY(-90px) scale(.7, 1.25);
        filter: blur(10px)
      }

      60% {
        opacity: 1;
        transform: translateY(8px) scale(1.06, .92);
        filter: blur(0)
      }

      80% {
        transform: translateY(-3px) scale(.99, 1.02)
      }

      100% {
        opacity: 1;
        transform: none;
        filter: blur(0)
      }
    }

    @keyframes bob {

      0%,
      100% {
        transform: translateY(0)
      }

      50% {
        transform: translateY(-6px)
      }
    }

    @keyframes sheen {
      0% {
        transform: translateX(-300px) skewX(-18deg)
      }

      45%,
      100% {
        transform: translateX(2150px) skewX(-18deg)
      }
    }

    @keyframes logofloat {

      0%,
      100% {
        transform: translateY(0)
      }

      50% {
        transform: translateY(-4px)
      }
    }

    @keyframes logoglow {

      0%,
      100% {
        filter: drop-shadow(0 4px 8px rgba(0, 102, 230, .15))
      }

      50% {
        filter: drop-shadow(0 6px 18px rgba(0, 102, 230, .3))
      }
    }

    @keyframes halo {

      0%,
      100% {
        opacity: .7;
        transform: scale(1)
      }

      50% {
        opacity: 1;
        transform: scale(1.06)
      }
    }

    .tagline {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 16px;
      margin-top: 10px;
      padding: 10px 28px;
      border-radius: 24px;
      font-family: var(--mono);
      font-size: 13.5px;
      letter-spacing: .34em;
      color: var(--tag-color);
      background: linear-gradient(180deg, rgba(var(--panel-a), .6), rgba(var(--panel-b), .6));
      backdrop-filter: blur(10px);
      border: 1px solid rgba(var(--acc-rgb), .2);
      animation: tagin 1.2s .55s cubic-bezier(.2, .8, .2, 1) both
    }

    .tagline::before {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      padding: 1px;
      pointer-events: none;
      background: conic-gradient(from var(--ang), transparent 0 70%, rgba(var(--acc-rgb), .95) 84%, transparent 96%);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      animation: angspin 7s linear infinite
    }

    .tagline svg {
      width: 13px;
      height: 13px;
      fill: var(--pumpkin);
      filter: drop-shadow(0 0 6px var(--pumpkin));
      animation: twinkle 2.4s ease-in-out infinite
    }

    .tagline svg:last-child {
      animation-delay: -1.2s
    }

    /* ---------- stage ---------- */
    .stagewrap {
      position: relative;
      flex: 1;
      min-height: 0;
      margin: 0 -7%
    }

    .shift {
      position: absolute;
      inset: 0;
      will-change: transform
    }

    #stage {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 1610px;
      height: 470px;
      transform: translate(-50%, -50%) scale(var(--k, 1))
    }

    #links {
      position: absolute;
      inset: -60px;
      width: calc(100% + 120px);
      height: calc(100% + 120px);
      overflow: visible;
      pointer-events: none
    }

    .slot {
      position: absolute;
      width: 285px;
      height: 98px;
      animation: rise 1s var(--d, .8s) cubic-bezier(.2, .9, .25, 1.05) both, bob 7s calc(var(--d, .8s) + 1s) ease-in-out infinite
    }

    .slot:nth-child(odd) {
      animation-duration: 1s, 7s
    }

    .slot:nth-child(even) {
      animation-duration: 1s, 8.5s
    }

    .node {
      position: relative;
      display: flex;
      align-items: center;
      gap: 15px;
      width: 100%;
      height: 100%;
      padding: 0 20px;
      border-radius: 19px;
      cursor: pointer;
      background: linear-gradient(160deg, rgba(var(--card-a), .95), rgba(var(--card-b), .98));
      backdrop-filter: blur(14px) saturate(1.35);
      border: 1px solid color-mix(in srgb, var(--c) 26%, transparent);
      box-shadow: 0 14px 34px rgba(0, 0, 0, .22), 0 0 26px color-mix(in srgb, var(--c) 10%, transparent), inset 0 1px 0 rgba(255, 255, 255, .9);
      transition: transform .18s ease-out, box-shadow .3s, border-color .3s;
      transform-style: preserve-3d;
      will-change: transform
    }

    .node::before {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      padding: 1.5px;
      pointer-events: none;
      background: conic-gradient(from var(--ang), transparent 0 60%, color-mix(in srgb, var(--c) 88%, white) 80%, transparent 93%);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      animation: angspin 6s linear infinite;
      opacity: .9
    }

    .slot:nth-child(2) .node::before {
      animation-duration: 7.5s
    }

    .slot:nth-child(3) .node::before {
      animation-duration: 5.2s
    }

    .slot:nth-child(4) .node::before {
      animation-duration: 8.4s
    }

    .slot:nth-child(5) .node::before {
      animation-duration: 6.6s
    }

    .node:hover {
      border-color: color-mix(in srgb, var(--c) 55%, transparent);
      box-shadow: 0 22px 46px rgba(0, 0, 0, .32), 0 0 44px color-mix(in srgb, var(--c) 30%, transparent), inset 0 1px 0 #fff
    }

    .node:focus-visible {
      outline: 2px solid var(--c);
      outline-offset: 5px
    }

    .spot {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      opacity: 0;
      transition: opacity .3s;
      background: radial-gradient(240px circle at var(--px, 50%) var(--py, 50%), color-mix(in srgb, var(--c) 26%, transparent), transparent 66%)
    }

    .node:hover .spot {
      opacity: 1
    }

    .scan {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      overflow: hidden;
      pointer-events: none
    }

    .scan::after {
      content: "";
      position: absolute;
      left: -30%;
      top: 0;
      bottom: 0;
      width: 30%;
      transform: skewX(-20deg);
      opacity: 0;
      background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--c) 30%, transparent), transparent)
    }

    .node:hover .scan::after {
      animation: scan .9s ease-out
    }

    .corner {
      position: absolute;
      right: 9px;
      bottom: 9px;
      width: 10px;
      height: 10px;
      border-right: 2px solid var(--c);
      border-bottom: 2px solid var(--c);
      border-radius: 0 0 5px 0;
      opacity: .85
    }

    .num {
      position: absolute;
      left: -13px;
      top: -15px;
      width: 31px;
      height: 31px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font: 700 13px var(--mono);
      color: #fff;
      transform: translateZ(30px);
      background: linear-gradient(145deg, color-mix(in srgb, var(--c) 70%, white), var(--c));
      box-shadow: 0 0 18px var(--c), inset 0 -2px 4px rgba(0, 0, 0, .25)
    }

    .num::after {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: 50%;
      border: 1.5px solid var(--c);
      animation: ping 2.6s ease-out infinite
    }

    .slot:nth-child(2) .num::after {
      animation-delay: -.5s
    }

    .slot:nth-child(3) .num::after {
      animation-delay: -1s
    }

    .slot:nth-child(4) .num::after {
      animation-delay: -1.5s
    }

    .slot:nth-child(5) .num::after {
      animation-delay: -2s
    }

    .tag {
      position: absolute;
      right: 14px;
      top: -10px;
      padding: 3px 10px;
      border-radius: 7px;
      transform: translateZ(24px);
      font: 700 10px var(--mono);
      letter-spacing: .07em;
      color: var(--c);
      background: #fff;
      border: 1px solid color-mix(in srgb, var(--c) 50%, transparent);
      box-shadow: 0 0 14px color-mix(in srgb, var(--c) 22%, transparent)
    }

    .ico {
      position: relative;
      flex: none;
      width: 54px;
      height: 54px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      transform: translateZ(18px);
      color: var(--c);
      background: radial-gradient(circle at 30% 22%, color-mix(in srgb, var(--c) 34%, transparent), color-mix(in srgb, var(--c) 7%, transparent) 75%);
      border: 1px solid color-mix(in srgb, var(--c) 42%, transparent);
      box-shadow: inset 0 0 18px color-mix(in srgb, var(--c) 22%, transparent), 0 0 16px color-mix(in srgb, var(--c) 18%, transparent)
    }

    .ico svg {
      width: 29px;
      height: 29px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.55;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 6px var(--c));
      overflow: visible
    }

    .txt {
      min-width: 0;
      transform: translateZ(12px)
    }

    .t {
      display: block;
      font: 700 18px 'Inter', sans-serif;
      color: var(--bone);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: -.005em
    }

    .d {
      display: block;
      margin-top: 4px;
      font-size: 13px;
      color: var(--bone-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    /* icon personalities */
    .ico.diya svg {
      animation: flick 3.2s infinite
    }

    .ico.lotus svg {
      animation: breathe 2.4s ease-in-out infinite
    }

    .node:hover .ico.lotus svg {
      animation: flap .5s ease-in-out infinite
    }

    .ico.mandala svg {
      animation: rot 40s linear infinite
    }

    .ico.klantern svg {
      animation: wob 4.5s ease-in-out infinite
    }

    .ico.coin svg {
      animation: floaty 3s ease-in-out infinite
    }

    .ico.matrix::before {
      content: "";
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 1px dashed color-mix(in srgb, var(--c) 50%, transparent);
      background: radial-gradient(circle at 50% 0, var(--c) 0 2.6px, transparent 3.4px);
      animation: rot 9s linear infinite
    }

    .ico.matrix .sp {
      transform-box: fill-box;
      transform-origin: center;
      animation: pulsestar 2.2s ease-in-out infinite
    }

    .node.ai {
      border: 1px dashed color-mix(in srgb, var(--c) 55%, transparent);
      background: linear-gradient(160deg, color-mix(in srgb, var(--c) 8%, rgba(var(--card-a), .9)), rgba(var(--card-b), .9))
    }

    .node.ai .aura {
      position: absolute;
      inset: -2px;
      border-radius: 21px;
      border: 1px solid var(--c);
      opacity: 0;
      pointer-events: none;
      animation: aura 3.4s ease-out infinite
    }

    .node.ai .aura.b {
      animation-delay: -1.7s
    }

    .num.ai {
      font-size: 11px
    }

    .ripple {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      width: 12px;
      height: 12px;
      margin: -6px 0 0 -6px;
      background: radial-gradient(circle, color-mix(in srgb, var(--c) 80%, white), transparent 70%);
      animation: ripple .8s ease-out forwards
    }

    /* ---------- connectors ---------- */
    .base {
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: draw 1.5s var(--dd) cubic-bezier(.5, 0, .2, 1) forwards
    }

    .glowp {
      fill: none;
      stroke-width: 7;
      stroke-linecap: round;
      filter: url(#blur);
      opacity: 0;
      animation: fadein 1s calc(var(--dd) + 1s) forwards;
      --o: .4
    }

    .flow {
      fill: none;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 1.5 13;
      opacity: 0;
      animation: flow 1.1s linear infinite, fadein 1s calc(var(--dd) + 1.2s) forwards;
      --o: .95
    }

    .port {
      opacity: 0;
      animation: fadein .6s calc(var(--dd) + .9s) forwards;
      --o: 1
    }


    /* =====================================================================
   KEYFRAMES
   ===================================================================== */
    @keyframes rot {
      to {
        transform: rotate(360deg)
      }
    }

    @keyframes angspin {
      to {
        --ang: 360deg
      }
    }

    @keyframes moonpulse {
      50% {
        box-shadow: 0 0 90px 30px rgba(var(--moon-glow), .36), 0 0 270px 115px rgba(var(--moon-glow2), .19)
      }
    }

    @keyframes cloud {
      from {
        transform: translateX(-120%)
      }

      to {
        transform: translateX(260%)
      }
    }

    @keyframes sway {

      0%,
      100% {
        transform: rotate(-.5deg)
      }

      50% {
        transform: rotate(.7deg)
      }
    }

    @keyframes swayr {

      0%,
      100% {
        transform: scaleX(-1) rotate(-.5deg)
      }

      50% {
        transform: scaleX(-1) rotate(.7deg)
      }
    }

    @keyframes fogmove {
      to {
        transform: translateX(9%)
      }
    }

    @keyframes candle {

      0%,
      100% {
        filter: drop-shadow(0 0 22px rgba(var(--acc-rgb), .55))
      }

      30% {
        filter: drop-shadow(0 0 30px rgba(var(--acc-rgb), .75))
      }

      60% {
        filter: drop-shadow(0 0 18px rgba(var(--acc-rgb), .45))
      }
    }

    @keyframes litflick {

      0%,
      100% {
        opacity: 1
      }

      20% {
        opacity: .82
      }

      45% {
        opacity: .96
      }

      70% {
        opacity: .78
      }
    }

    @keyframes spiderdrop {

      0%,
      8% {
        transform: translateY(0)
      }

      38%,
      52% {
        transform: translateY(200px)
      }

      82%,
      100% {
        transform: translateY(0)
      }
    }

    @keyframes slidedown {
      from {
        opacity: 0;
        transform: translateY(-30px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    @keyframes sweepline {

      0%,
      100% {
        opacity: .15
      }

      50% {
        opacity: .7
      }
    }

    @keyframes ping {
      0% {
        transform: scale(1);
        opacity: .7
      }

      100% {
        transform: scale(2.6);
        opacity: 0
      }
    }

    @keyframes blink {
      50% {
        opacity: .2
      }
    }

    @keyframes dashmove {
      to {
        stroke-dashoffset: -760
      }
    }

    @keyframes shimmer {
      0% {
        background-position: 100% 0
      }

      50% {
        background-position: 0% 0
      }

      100% {
        background-position: 100% 0
      }
    }

    @keyframes candlelogo {

      0%,
      100% {
        filter: drop-shadow(0 0 16px rgba(var(--acc-rgb), .28)) drop-shadow(0 0 40px rgba(var(--acc-rgb), .16))
      }

      45% {
        filter: drop-shadow(0 0 22px rgba(var(--acc-rgb), .4)) drop-shadow(0 0 50px rgba(var(--acc-rgb), .22))
      }

      70% {
        filter: drop-shadow(0 0 13px rgba(var(--acc-rgb), .22)) drop-shadow(0 0 34px rgba(var(--acc-rgb), .12))
      }
    }

    @keyframes blurin {
      from {
        opacity: 0;
        filter: blur(18px);
        transform: scale(1.12)
      }

      to {
        opacity: 1
      }
    }

    @keyframes tagin {
      from {
        opacity: 0;
        letter-spacing: .7em
      }

      to {
        opacity: 1;
        letter-spacing: .34em
      }
    }

    @keyframes twinkle {
      50% {
        transform: scale(.55) rotate(45deg);
        opacity: .5
      }
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(46px) scale(.9);
        filter: blur(10px)
      }

      to {
        opacity: 1;
        transform: none;
        filter: blur(0)
      }
    }

    @keyframes bob {
      50% {
        transform: translateY(-4px)
      }
    }

    @keyframes scan {
      from {
        left: -30%;
        opacity: 1
      }

      to {
        left: 120%;
        opacity: 0
      }
    }

    @keyframes flick {

      0%,
      100% {
        filter: drop-shadow(0 0 6px var(--c))
      }

      25% {
        filter: drop-shadow(0 0 11px var(--c))
      }

      55% {
        filter: drop-shadow(0 0 4px var(--c))
      }

      80% {
        filter: drop-shadow(0 0 10px var(--c))
      }
    }

    @keyframes breathe {
      50% {
        transform: scaleY(.88)
      }
    }

    @keyframes flap {

      0%,
      100% {
        transform: scaleY(1)
      }

      50% {
        transform: scaleY(.62)
      }
    }

    @keyframes wob {

      0%,
      100% {
        transform: rotate(-4deg)
      }

      50% {
        transform: rotate(4deg)
      }
    }

    @keyframes floaty {

      0%,
      100% {
        transform: translateY(1.5px)
      }

      50% {
        transform: translateY(-2.5px)
      }
    }

    @keyframes pulsestar {

      0%,
      100% {
        transform: scale(.72);
        opacity: .8
      }

      50% {
        transform: scale(1.2);
        opacity: 1
      }
    }

    @keyframes aura {
      0% {
        opacity: .55;
        transform: scale(1)
      }

      100% {
        opacity: 0;
        transform: scale(1.22, 1.45)
      }
    }

    @keyframes ripple {
      to {
        transform: scale(40);
        opacity: 0
      }
    }

    @keyframes draw {
      to {
        stroke-dashoffset: 0
      }
    }

    @keyframes fadein {
      from {
        opacity: 0
      }

      to {
        opacity: var(--o, 1)
      }
    }

    @keyframes flow {
      to {
        stroke-dashoffset: -29
      }
    }

    @media (prefers-reduced-motion:reduce) {

      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        animation-delay: 0s !important
      }

      .base {
        stroke-dashoffset: 0
      }
    }


    /* glass module cards */
    .node {
      background: linear-gradient(160deg, rgba(255, 255, 255, .8), rgba(228, 241, 252, .52));
      -webkit-backdrop-filter: blur(16px) saturate(1.35);
      backdrop-filter: blur(16px) saturate(1.35);
      border: 1px solid rgba(255, 255, 255, .88);
      box-shadow: 0 16px 36px rgba(28, 58, 92, .24), 0 0 26px color-mix(in srgb, var(--c) 10%, transparent), inset 0 1px 0 #fff, inset 0 -8px 20px rgba(165, 205, 238, .28)
    }

    .node:hover {
      border-color: color-mix(in srgb, var(--c) 55%, #fff);
      box-shadow: 0 22px 46px rgba(28, 58, 92, .3), 0 0 44px color-mix(in srgb, var(--c) 30%, transparent), inset 0 1px 0 #fff, inset 0 -8px 20px rgba(165, 205, 238, .34)
    }

    .node.inv {
      background: linear-gradient(160deg, rgba(255, 255, 255, .8), rgba(228, 241, 252, .52));
      border-color: rgba(255, 255, 255, .88)
    }

    .node .t,
    .node.inv .t {
      color: #10304a
    }

    .node .d,
    .node.inv .d {
      color: rgba(16, 48, 74, .64)
    }

    .node.ai {
      background: linear-gradient(160deg, color-mix(in srgb, var(--c) 14%, rgba(255, 255, 255, .82)), rgba(228, 241, 252, .55))
    }

    .ico.matrix::before {
      content: "";
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 1px dashed color-mix(in srgb, var(--c) 50%, transparent);
      background: radial-gradient(circle at 50% 0, var(--c) 0 2.6px, transparent 3.4px);
    }

    .ico.matrix .sp {
      transform-box: fill-box;
      transform-origin: center;
    }

    @keyframes rot {
      to {
        transform: rotate(360deg)
      }
    }

    :root {
      --pumpkin: #3b8fe8;
      --ember: #7fc0ff;
      --acc-rgb: 59, 143, 232;
      --bone: #F5F9FF;
      --mono: 'Space Mono', ui-monospace, monospace;
      --card-a: 255, 255, 255;
      --card-b: 232, 243, 252;
      --bg: #070B12;
      --bg2: #0C1420;
      --navy: #101D2C;
      --ice: #A9D5F5;
      --snow: #F5F9FF;
      --silver: #C7D4E0;
      --warm: #F4C98B;
      --fog: 0
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html,
    body {
      height: 100%
    }

    body {
      background: var(--bg);
      color: var(--snow);
      font-family: 'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none
    }

    #bg {
      z-index: 0;
      opacity: 0
    }

    #snowB {
      z-index: 2
    }

    #frost {
      z-index: 4
    }

    #snowF {
      z-index: 7
    }

    .fogs {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      overflow: hidden;
      opacity: var(--fog)
    }

    .fogs i {
      position: absolute;
      left: -30%;
      right: -30%;
      top: 34%;
      height: 46%;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='400'><filter id='n' x='0' y='0' width='100%' height='100%'><feTurbulence type='fractalNoise' baseFrequency='.004 .011' numOctaves='3' seed='5' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .62 0 0 0 0 .74 0 0 0 0 .88 0 0 0 1.5 -.55'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      background-size: 1200px 100%;
      animation: drift 120s linear infinite;
      -webkit-mask-image: linear-gradient(transparent, #000 45%, transparent);
      mask-image: linear-gradient(transparent, #000 45%, transparent)
    }

    .fogs i+i {
      top: 48%;
      height: 40%;
      opacity: .7;
      animation-duration: 68s;
      animation-direction: reverse
    }

    @keyframes drift {
      to {
        background-position: -1200px 0
      }
    }

    .cold {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.2s ease;
      background: radial-gradient(ellipse at 50% 55%, rgba(60, 120, 190, .0) 0, rgba(40, 90, 160, .22) 100%);
      mix-blend-mode: screen
    }

    body.s-freeze .cold {
      opacity: 1
    }

    .sweep {
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      opacity: 0;
      background: linear-gradient(104deg, transparent 38%, rgba(169, 213, 245, .13) 48%, rgba(245, 249, 255, .2) 50%, rgba(169, 213, 245, .13) 52%, transparent 62%);
      transform: translateX(-110%)
    }

    body.s-sweep .sweep {
      animation: sweep 0.96s cubic-bezier(.4, 0, .2, 1) forwards
    }

    @keyframes sweep {
      0% {
        opacity: 0;
        transform: translateX(-110%)
      }

      15% {
        opacity: 1
      }

      85% {
        opacity: 1
      }

      100% {
        opacity: 0;
        transform: translateX(110%)
      }
    }

    .vig {
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      background: radial-gradient(ellipse at 50% 46%, transparent 40%, rgba(5, 8, 13, .72) 100%)
    }

    .scrim {
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.8s;
      background: radial-gradient(ellipse 55% 42% at 50% 52%, rgba(6, 10, 16, .62), transparent 75%)
    }

    body.s-center .scrim {
      opacity: 1
    }

    /* opening line */
    .k1 {
      position: fixed;
      left: 0;
      right: 0;
      top: 50%;
      z-index: 6;
      text-align: center;
      transform: translateY(-50%);
      font-size: clamp(12px, 1.5vw, 17px);
      font-weight: 500;
      letter-spacing: .7em;
      padding-left: .7em;
      color: var(--silver);
      opacity: 0;
      pointer-events: none;
      text-shadow: 0 2px 24px #000
    }

    body.s-k1 .k1 {
      opacity: 1;
      letter-spacing: .42em;
      padding-left: .42em;
      transition: opacity 0.72s ease, letter-spacing 1.44s cubic-bezier(.2, .7, .2, 1)
    }

    body.s-k1out .k1 {
      opacity: 0;
      transition: opacity 0.4s ease, letter-spacing 1.44s
    }

    /* headline stack */
    .center {
      position: fixed;
      inset: 0;
      z-index: 6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 84px 6vw 64px;
      pointer-events: none
    }

    .air {
      font-size: clamp(10px, 1.1vw, 13px);
      font-weight: 500;
      letter-spacing: .5em;
      padding-left: .5em;
      color: var(--ice);
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.56s 0.04s, transform 0.56s 0.04s;
      margin-bottom: min(2.2vh, 18px)
    }

    body.s-center .air {
      opacity: 1;
      transform: none
    }

    h1 {
      font-weight: 300;
      font-size: min(11.2vw, 16.5vh);
      line-height: .93;
      letter-spacing: -.025em;
      text-shadow: 0 4px 40px rgba(0, 0, 0, .55)
    }

    h1 .ln {
      display: block;
      overflow: hidden;
      padding: .05em .1em
    }

    h1 .ln span {
      display: inline-block;
      transform: translateY(108%);
      opacity: 0;
      transition: transform 0.6s cubic-bezier(.16, 1, .3, 1), opacity 0.48s, letter-spacing 0.96s cubic-bezier(.2, .7, .2, 1);
      letter-spacing: .06em
    }

    h1 .ln+.ln span {
      transition-delay: 0.07s;
      font-weight: 700;
      background: linear-gradient(180deg, #fff 15%, var(--ice) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      padding-right: .04em
    }

    body.s-center h1 .ln span {
      transform: none;
      opacity: 1;
      letter-spacing: -.02em
    }

    .arr {
      margin-top: min(3.6vh, 30px);
      font-size: min(3.6vw, 4.6vh);
      font-weight: 500;
      letter-spacing: .36em;
      padding-left: .36em;
      color: var(--snow);
      text-shadow: 0 2px 24px rgba(0, 0, 0, .6);
      white-space: nowrap
    }

    .arr b {
      display: inline-block;
      font-weight: 500;
      opacity: 0;
      transform: translateY(.5em);
      filter: blur(8px);
      transition: opacity 0.36s, transform 0.36s cubic-bezier(.2, .8, .2, 1), filter 0.36s
    }

    body.s-arr .arr b {
      opacity: 1;
      transform: none;
      filter: blur(0)
    }

    .sub {
      margin-top: min(1.8vh, 16px);
      font-size: clamp(13px, 1.35vw, 17px);
      font-weight: 300;
      color: var(--silver);
      letter-spacing: .04em;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.64s, transform 0.64s
    }

    body.s-sub .sub {
      opacity: 1;
      transform: none
    }

    .cap {
      margin-top: min(3vh, 26px);
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 11px;
      letter-spacing: .5em;
      color: var(--warm);
      opacity: 0;
      transition: opacity 0.64s
    }

    .cap::before,
    .cap::after {
      content: "";
      width: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--warm));
      transition: width 0.72s 0.08s
    }

    .cap::after {
      transform: scaleX(-1)
    }

    body.s-cap .cap {
      opacity: .95
    }

    body.s-cap .cap::before,
    body.s-cap .cap::after {
      width: clamp(24px, 5vw, 56px)
    }

    /* header + footer */
    .top {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 8;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: clamp(14px, 3vh, 26px) clamp(18px, 4vw, 56px);
      opacity: 0;
      transform: translateY(-12px);
      transition: opacity 0.64s, transform 0.64s cubic-bezier(.2, .8, .2, 1)
    }

    body.s-top .top {
      opacity: 1;
      transform: none
    }

    .brand {
      background: linear-gradient(180deg, rgba(247, 251, 255, .96), rgba(222, 236, 248, .9));
      border-radius: 14px;
      padding: 6px 14px 4px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .45), 0 0 0 1px rgba(255, 255, 255, .35) inset
    }

    .brand .logo {
      width: clamp(128px, 15vw, 184px);
      margin: 0;
      animation: none
    }

    .brand .logo::before {
      display: none
    }

    .nseason {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 11px;
      letter-spacing: .42em;
      color: var(--silver);
      font-weight: 500
    }

    .nseason::before {
      content: "";
      width: clamp(18px, 4vw, 44px);
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--ice))
    }

    .foot {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 8;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: clamp(12px, 2.4vh, 22px) clamp(18px, 4vw, 56px);
      font-size: 11px;
      letter-spacing: .2em;
      color: rgba(199, 212, 224, .7);
      opacity: 0;
      transition: opacity 0.64s
    }

    body.s-cap .foot {
      opacity: 1
    }

    .foot .ed {
      color: var(--ice);
      letter-spacing: .42em
    }

    .ctls {
      display: flex;
      gap: 10px;
      position: absolute;
      left: 50%;
      transform: translateX(-50%)
    }

    .ctl {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      cursor: pointer;
      color: var(--silver);
      background: rgba(12, 20, 32, .55);
      border: 1px solid rgba(169, 213, 245, .28);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      transition: .25s
    }

    .ctl:hover {
      color: #fff;
      border-color: var(--ice);
      box-shadow: 0 0 18px rgba(169, 213, 245, .3)
    }

    .ctl svg {
      width: 15px;
      height: 15px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .ctl .x {
      opacity: 0
    }

    .ctl[aria-pressed=false] .w {
      opacity: 0
    }

    .ctl[aria-pressed=false] .x {
      opacity: 1
    }

    .ctl:focus-visible {
      outline: 2px solid var(--ice);
      outline-offset: 3px
    }

    @media(max-width:640px) {
      .foot {
        flex-direction: column-reverse;
        gap: 10px;
        letter-spacing: .14em
      }

      .ctls {
        position: static;
        transform: none
      }

      .arr {
        white-space: normal;
        letter-spacing: .24em;
        padding-left: .24em
      }

      .nseason {
        letter-spacing: .3em
      }
    }

    /* logo waits for the reveal */
    body:not(.s-logo) .logo,
    body:not(.s-logo) .logo * {
      animation-play-state: paused !important
    }

    body.rm * {
      transition: none !important;
      animation: none !important
    }

    body.rm .logo * {
      animation: none !important
    }

    /* tools: appear after the reveal, headline lifts and shrinks above them */
    .center {
      transition: transform 1.6s cubic-bezier(.65, 0, .2, 1)
    }

    body.s-mod .center {
      transform: translateY(-27vh) scale(.5)
    }

    body.s-mod .sub,
    body.s-mod .cap {
      opacity: 0 !important
    }

    .stagewrap {
      position: fixed;
      z-index: 6;
      left: 7vw;
      right: 7vw;
      top: 35vh;
      bottom: 62px;
      display: block;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.2s .9s
    }

    body.s-mod .stagewrap {
      opacity: 1;
      pointer-events: auto
    }

    .stagewrap .shift {
      width: 100%;
      height: 100%
    }

    body:not(.s-mod) .slot {
      animation: none !important;
      opacity: 0
    }

    .node {
      background: linear-gradient(160deg, rgba(20, 34, 52, .74), rgba(10, 18, 30, .62)) !important;
      border: 1px solid rgba(169, 213, 245, .26) !important;
      -webkit-backdrop-filter: blur(14px) saturate(1.2);
      backdrop-filter: blur(14px) saturate(1.2);
      box-shadow: 0 18px 40px rgba(0, 0, 0, .5), 0 0 28px color-mix(in srgb, var(--c) 14%, transparent), inset 0 1px 0 rgba(255, 255, 255, .1) !important
    }

    .node:hover {
      border-color: color-mix(in srgb, var(--c) 60%, #fff) !important
    }

    .node .t,
    .node.inv .t {
      color: #F5F9FF !important
    }

    .node .d,
    .node.inv .d {
      color: #C7D4E0 !important
    }

    .node.ai {
      background: linear-gradient(160deg, color-mix(in srgb, var(--c) 22%, rgba(20, 34, 52, .8)), rgba(10, 18, 30, .66)) !important
    }

    /* make the headline colour explicit (some browsers ignore inherited colour on clipped text) */
    h1,
    h1 .ln span {
      color: #F5F9FF;
      -webkit-text-fill-color: #F5F9FF
    }

    h1 .ln+.ln span {
      color: transparent;
      -webkit-text-fill-color: transparent
    }

    .arr,
    .arr b {
      color: #F5F9FF
    }

    /* short windows: once the tools appear, give them the whole screen instead of stacking under the headline */
    @media (max-height:620px) {
      body.s-mod .center {
        opacity: 0;
        transition: opacity .8s
      }

      .stagewrap {
        top: 78px;
        bottom: 54px
      }
    }

    @media (max-height:620px) and (max-width:700px) {
      .stagewrap {
        left: 2vw;
        right: 2vw
      }
    }

    /* hardening against host/OS overrides (global app CSS, forced colours, forced dark mode) */
    html {
      color-scheme: dark
    }

    body,
    body * {
      forced-color-adjust: none
    }

    h1,
    h1 .ln span {
      color: #F5F9FF !important;
      -webkit-text-fill-color: #F5F9FF !important
    }

    h1 .ln+.ln span {
      color: transparent !important;
      -webkit-text-fill-color: transparent !important
    }

    .arr,
    .arr b,
    .k1 {
      color: #F5F9FF !important
    }

    a,
    a:hover,
    .node,
    .node * {
      text-decoration: none !important
    }

    a {
      color: inherit
    }
  </style>
</head>

      let spr = null, xg = 0; addEventListener('module:open', () => { xg = 1 });
      function mkSprite() { const s = document.createElement('canvas'); s.width = s.height = 32; const x = s.getContext('2d'), g = x.createRadialGradient(16, 16, 0, 16, 16, 16); g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(.35, 'rgba(255,255,255,.7)'); g.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = g; x.fillRect(0, 0, 32, 32); return s }
      const LAY = [{ n: 300, r: [.9, 1.9], a: [.25, .6], v: [26, 50], k: .35, cv: 'B' }, { n: 150, r: [1.8, 3.4], a: [.4, .8], v: [55, 95], k: .7, cv: 'B' }, { n: 34, r: [6, 13], a: [.18, .4], v: [120, 200], k: 1.3, cv: 'F' }];
      let FL = [];
      function mkFlakes() {
        const dens = (small ? .5 : 1) * clamp(VW * VH / (1440 * 800), .4, 1.3); FL = [];
        LAY.forEach((L, li) => { const n = Math.round(L.n * dens); for (let i = 0; i < n; i++)FL.push({ l: li, x: Math.random() * VW, y: Math.random() * VH, r: L.r[0] + Math.random() * (L.r[1] - L.r[0]), a: L.a[0] + Math.random() * (L.a[1] - L.a[0]), v: L.v[0] + Math.random() * (L.v[1] - L.v[0]), p: Math.random() * 6.28, q: .4 + Math.random() * .9, u: i / n }) })
      }
      function drawSnow(dt) {
        const dens = .05 + .95 * sm(3.2, 8.6, T) * (T > 11 ? (1 - .1 * sm(11, 15, T)) : 1), sp = .65 + .35 * sm(3, 9, T), gust = Math.exp(-Math.pow((T - 9.6) / 1.2, 2));
        xg *= Math.exp(-dt * 1.1); const wind = (18 + 60 * sm(4, 9, T)) * (.6 + .4 * Math.sin(RT * .35)) + 210 * gust + 260 * xg;
        sBx.clearRect(0, 0, VW, VH); sFx.clearRect(0, 0, VW, VH);
        for (const f of FL) {
          if (f.u > dens) continue; const L = LAY[f.l];
          f.p += dt * f.q; f.y += f.v * sp * dt * (VH / 800 > 1 ? 1 : 1); f.x += (wind * L.k + Math.sin(f.p) * 12 * L.k) * dt;
          if (f.y > VH + 20) { f.y = -20; f.x = Math.random() * VW } if (f.x > VW + 30) f.x -= VW + 60; if (f.x < -30) f.x += VW + 60;
          let a = f.a * clamp(dens * 1.6 + .1, 0, 1), warm = 0;
          if (f.l < 2) for (const m of lampScreen) { const dx = f.x - m.x, dy = f.y - m.y, d2 = dx * dx + dy * dy; if (d2 < m.r * m.r) { const k = 1 - Math.sqrt(d2) / m.r; warm = Math.max(warm, k * m.i); } }
          const ctx = L.cv === 'F' ? sFx : sBx; ctx.globalAlpha = Math.min(1, a + warm * .55);
          const s = f.r * (warm > .05 ? 1 + warm * .5 : 1) * 2;
          ctx.drawImage(spr, f.x - s, f.y - s, s * 2, s * 2);
          if (warm > .1) { ctx.globalAlpha = warm * .5 * a; ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = rgba(WARM, 1); ctx.beginPath(); ctx.arc(f.x, f.y, f.r * .8, 0, 6.283); ctx.fill(); ctx.globalCompositeOperation = 'source-over' }
        }
        sBx.globalAlpha = sFx.globalAlpha = 1;
      }
      /* ---------------- frost: dendritic ice grown from the edges, revealed in layers ---------------- */
      let FRL = [], frostP = -1; const FS = .7;
      function buildFrost() {
        const w = Math.ceil(VW * FS), h = Math.ceil(VH * FS), r = rng(71); FRL = [];
        const mk = () => { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')] };
        const [c0, x0] = mk(), [c1, x1] = mk(), [c2, x2] = mk(), [c3, x3] = mk();
        const m = Math.min(w, h);
        // L0 frosted glass haze at the borders
        [[0, 0, 0, .16 * h, 'v'], [0, h, 0, h - .16 * h, 'v'], [0, 0, .14 * w, 0, 'h'], [w, 0, w - .14 * w, 0, 'h']].forEach(([a, b, c, d, o]) => {
          const g = o === 'v' ? x0.createLinearGradient(0, a ? 0 : b ? h : 0, 0, b ? h - .16 * h : .16 * h) : x0.createLinearGradient(a ? 0 : w, 0, a ? .14 * w : w - .14 * w, 0);
          g.addColorStop(0, 'rgba(205,232,252,.5)'); g.addColorStop(1, 'rgba(205,232,252,0)'); x0.fillStyle = g; x0.fillRect(0, 0, w, h)
        });
        [[0, 0], [w, 0], [0, h], [w, h]].forEach(([cx, cy]) => { const g = x0.createRadialGradient(cx, cy, 0, cx, cy, m * .5); g.addColorStop(0, 'rgba(230,244,255,.7)'); g.addColorStop(1, 'rgba(230,244,255,0)'); x0.fillStyle = g; x0.fillRect(0, 0, w, h) });
        for (let i = 0; i < 2600; i++) { const e = r() < .5, x = e ? r() * w : (r() < .5 ? 0 : w) + (r() - .5) * w * .2 * r(), y = e ? (r() < .5 ? 0 : h) + (r() - .5) * h * .2 * r() : r() * h; x0.fillStyle = `rgba(235,247,255,${.05 + r() * .18})`; x0.fillRect(x, y, 1 + r() * 2.2, 1 + r() * 2.2) }
        // dendrites
        function br(x, y, a, len, d, ctx, wd) {
          const x2_ = x + Math.cos(a) * len, y2_ = y + Math.sin(a) * len; ctx.lineWidth = wd; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x2_, y2_); ctx.stroke();
          if (d <= 0) return; for (const q of [.45, .75]) { const bx_ = x + (x2_ - x) * q, by_ = y + (y2_ - y) * q; br(bx_, by_, a + .95, len * (.5 - q * .18), d - 1, ctx, wd * .7); br(bx_, by_, a - .95, len * (.5 - q * .18), d - 1, ctx, wd * .7) } br(x2_, y2_, a + (r() - .5) * .5, len * .55, d - 1, ctx, wd * .8)
        }
        const seed = (ctx, n, L, d, wd, al) => {
          ctx.strokeStyle = `rgba(226,243,255,${al})`; ctx.lineCap = 'round';
          for (let i = 0; i < n; i++) {
            const side = r() * 4 | 0, t = r(); let x, y, a;
            if (side === 0) { x = t * w; y = 0; a = Math.PI / 2 } else if (side === 1) { x = t * w; y = h; a = -Math.PI / 2 } else if (side === 2) { x = 0; y = t * h; a = 0 } else { x = w; y = t * h; a = Math.PI }
            const cd = Math.min(Math.hypot(x - (x < w / 2 ? 0 : w), y - (y < h / 2 ? 0 : h)) / (m * .35), 1), boost = 1 + (1 - cd) * 1.1;
            br(x, y, a + (r() - .5) * .9, L * (.6 + r() * .8) * boost, d, ctx, wd)
          }
        };
        seed(x1, Math.round(w / 16), m * .2, 3, 1.3, .42);
        seed(x2, Math.round(w / 7), m * .09, 3, .8, .38);
        for (let i = 0; i < 260; i++) {
          const side = r() * 4 | 0, t = r(), dp = Math.pow(r(), 2.4) * m * .18; let x = side < 2 ? t * w : (side === 2 ? dp : w - dp), y = side > 1 ? t * h : (side === 0 ? dp : h - dp);
          const s = 1.5 + r() * 4; x3.strokeStyle = `rgba(255,255,255,${.35 + r() * .5})`; x3.lineWidth = 1; x3.beginPath(); x3.moveTo(x - s, y); x3.lineTo(x + s, y); x3.moveTo(x, y - s); x3.lineTo(x, y + s); x3.stroke()
        }
        FRL = [c0, c1, c2, c3]; frostP = -1;
      }
      function drawFrost() {
        const p = sm(7.6, 13.6, T); if (Math.abs(p - frostP) < .002) return; frostP = p;
        frx.clearRect(0, 0, VW, VH); if (p <= 0 || !FRL.length) return;
        FRL.forEach((c, i) => { frx.globalAlpha = sm(.04 + i * .16, .5 + i * .16, p) * (i === 3 ? 1 : .92); frx.drawImage(c, 0, 0, VW, VH) }); frx.globalAlpha = 1;
        const R = Math.hypot(VW, VH) / 2, ri = lerp(1.12, .55, p) * R, g = frx.createRadialGradient(VW / 2, VH / 2, ri, VW / 2, VH / 2, ri + R * .3); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,1)');
        frx.globalCompositeOperation = 'destination-in'; frx.fillStyle = g; frx.fillRect(0, 0, VW, VH); frx.globalCompositeOperation = 'source-over';
      }
      /* ---------------- timeline ---------------- */
      const CUES = [[15.0, 's-mod'], [.9, 's-k1'], [3.9, 's-k1out'], [8.2, 's-freeze'], [8.5, 's-center'], [9.1, 's-sweep'], [11, 's-top'], [11.1, 's-logo'], [11.4, 's-arr'], [12.9, 's-sub'], [13.9, 's-cap']];
      let fired = new Set();
      // positions the tools area from the window size directly (no dependence on CSS layout), so host styles can't shrink or shift it
      function fit() {
        const w = innerWidth, h = innerHeight, short = h < 620, top = short ? 78 : Math.round(h * .35), bot = short ? 54 : 62, ah = Math.max(120, h - top - bot), aw = w * .9;
        wrap.style.cssText = `position:fixed;z-index:6;left:${(w - aw) / 2}px;top:${top}px;width:${aw}px;height:${ah}px;margin:0;display:block`;
        stage.style.setProperty('--k', Math.max(.3, Math.min(1.2, aw / 1700, ah / 525)).toFixed(3))
      }
      function showMods() { setTimeout(fit, 400); setTimeout(fit, 1800);[...links.children].forEach(c => { if (c.tagName.toLowerCase() !== 'defs') c.remove() }); buildLinks(false); fit() }
      function cues() { for (const [t, c] of CUES) { if (T >= t && !fired.has(c)) { fired.add(c); document.body.classList.add(c); if (c === 's-mod') showMods() } } }
      function resetCues() { CUES.forEach(([, c]) => document.body.classList.remove(c)); fired = new Set();[...links.children].forEach(c => { if (c.tagName.toLowerCase() !== 'defs') c.remove() }) }
      function replay() {
        resetCues(); T = 0; cam = 0; lastDraw = 0; frostP = -1;
        const lg = $('.brand .logo'); lg.replaceWith(lg.cloneNode(true));   // restart the logo's own draw-in
        FL.forEach(f => { f.y = Math.random() * VH });
        if (reduce) return; if (!running) { running = true; requestAnimationFrame(frame) }
      }
      $('#rep').addEventListener('click', replay);
      addEventListener('keydown', e => { if (e.key === 'Escape' && T < DUR) T = DUR });
      /* ---------------- loop ---------------- */
      let running = false;
      function render(dt) {
        cues();
        const spd = T < 9 ? 3.4 * sm(0, 3.2, T) : lerp(3.4, .32, sm(9, 15, T)); cam += (T >= DUR ? .3 : spd) * dt;
        bg.style.opacity = sm(0, 2.4, T).toFixed(3);
        document.documentElement.style.setProperty('--fog', (.12 + .36 * sm(1, 5, T)).toFixed(3));
        drawCity(); drawSnow(dt); drawFrost();
      }
      function frame(t) {
        if (document.hidden) { lastDraw = 0; requestAnimationFrame(frame); return }
        const rdt = lastDraw ? Math.min(2, (t - lastDraw) / 1000) : .016, dt = Math.min(.05, rdt); lastDraw = t;
        RT += dt; if (T < DUR) T = Math.min(DUR + .01, T + rdt * SP);   // timeline follows the wall clock so it stays ~5s even on slow GPUs
        render(dt); requestAnimationFrame(frame);
      }
      function resize() {
        VW = innerWidth; VH = innerHeight; if (VW < 2 || VH < 2) return; DP = Math.min(devicePixelRatio || 1, VW < 700 ? 1.5 : 1.25); small = VW < 700;
        F = VH * .9; VPX = VW / 2; VPY = VH * .46;
        [bg, sB, sF, fr].forEach(c => { c.width = Math.ceil(VW * DP); c.height = Math.ceil(VH * DP); c.getContext('2d').setTransform(DP, 0, 0, DP, 0, 0) });
        mkFlakes(); buildFrost(); if (reduce || !running) render(0)
      }
      let rz = 0; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { resize(); fit() }, 150) }); addEventListener('load', fit);
      // type the arriving line letter by letter (for the staggered reveal)
      (() => { const a = $('.arr'); const txt = a.textContent; a.setAttribute('aria-label', txt); a.textContent = '';[...txt].forEach((ch, i) => { const b = document.createElement('b'); b.textContent = ch === ' ' ? ' ' : ch; b.setAttribute('aria-hidden', 'true'); b.style.transitionDelay = (i * .03) + 's'; a.appendChild(b) }) })();
      spr = mkSprite();
      const m = /[#&]t=(\d+(\.\d+)?)/.exec(location.hash);
      if (reduce) { document.body.classList.add('rm'); T = DUR; cam = 60 } else if (m) { T = Math.min(DUR, +m[1]); cam = T * 1.6 }
      resize();
      if (reduce) { CUES.forEach(([, c]) => document.body.classList.add(c)); showMods(); render(0) } else { running = true; requestAnimationFrame(frame) }
    })();

  </script>
