<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alchemy · ALCHEMOS · Happy Diwali</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@700;800&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bone: #fff1dc;
      --bone-dim: rgba(255, 232, 200, .66);
      --mono: 'Space Mono', ui-monospace, monospace;
      --pumpkin: #ffb347;
      --ember: #ffd166;
      --acc-rgb: 255, 190, 80;
      --panel-a: 84, 16, 10;
      --panel-b: 46, 8, 6;
      --tag-color: #ffe3a3;
      --card-a: 34, 12, 20;
      --card-b: 20, 6, 14;
    }

    @property --ang {
      syntax: '<angle>';
      inherits: false;
      initial-value: 0deg
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html,
    body {
      height: 100%
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--bone);
      overflow: hidden;
      background: #05030c
    }

    a {
      color: inherit;
      text-decoration: none
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none
    }

    #sky {
      z-index: 0
    }

    #fw {
      z-index: 1
    }

    #rf {
      z-index: 4
    }

    #dy {
      z-index: 5
    }

    #fxc {
      z-index: 10
    }

    .skyline {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 27.5vh;
      height: 15vh;
      z-index: 2;
      pointer-events: none
    }

    .skyline svg {
      display: block;
      width: 100%;
      height: 100%
    }

    .palace {
      position: fixed;
      left: 50%;
      bottom: 27.5vh;
      width: min(100vw, 112vh);
      transform: translateX(-50%);
      z-index: 3;
      pointer-events: none;
      filter: brightness(calc(1 + var(--lit, 0)*.55)) saturate(calc(1 + var(--lit, 0)*.4))
    }

    .palace svg {
      display: block;
      width: 100%;
      height: auto
    }

    .haze {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 27.5vh;
      height: 14vh;
      z-index: 3;
      pointer-events: none;
      background: linear-gradient(0deg, rgba(255, 150, 70, .28), rgba(255, 120, 60, .08) 55%, transparent)
    }

    .ltA {
      animation: ltw 2.6s ease-in-out infinite
    }

    .ltB {
      animation: ltw 3.1s -.8s ease-in-out infinite
    }

    .ltC {
      animation: ltw 2.2s -1.4s ease-in-out infinite
    }

    .ltD {
      animation: ltw 3.6s -2.1s ease-in-out infinite
    }

    @keyframes ltw {

      0%,
      100% {
        opacity: .45
      }

      50% {
        opacity: 1
      }
    }

    .flashov {
      position: fixed;
      inset: 0;
      z-index: 6;
      pointer-events: none;
      mix-blend-mode: screen;
      opacity: 0;
      background: radial-gradient(ellipse 60% 55% at var(--fx, 50%) var(--fy, 30%), rgba(var(--fc, 255, 190, 90), .55), rgba(var(--fc, 255, 190, 90), .12) 50%, transparent 75%)
    }

    .garl {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 190px;
      z-index: 6;
      pointer-events: none;
      transform-origin: 50% 0;
      animation: garlsway 8s ease-in-out infinite
    }

    @keyframes garlsway {

      0%,
      100% {
        transform: rotate(-.25deg)
      }

      50% {
        transform: rotate(.25deg)
      }
    }

    .hang {
      position: fixed;
      top: -4px;
      z-index: 8;
      width: 92px;
      pointer-events: none;
      transform-origin: 50% 0;
      animation: lsw 6s ease-in-out infinite;
      filter: drop-shadow(0 0 22px rgba(255, 150, 50, .6))
    }

    .hang svg {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible
    }

    .hang.l {
      left: 3.2%
    }

    .hang.r {
      right: 3.2%;
      animation-delay: -2.6s;
      width: 78px
    }

    .hang .lcore {
      animation: lcore 2.6s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center
    }

    @keyframes lsw {

      0%,
      100% {
        transform: rotate(-3.5deg)
      }

      50% {
        transform: rotate(3.5deg)
      }
    }

    @keyframes lcore {

      0%,
      100% {
        opacity: .75;
        transform: scale(.94)
      }

      45% {
        opacity: 1;
        transform: scale(1.06)
      }

      70% {
        opacity: .85
      }
    }

    .vignette {
      position: fixed;
      inset: 0;
      z-index: 9;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, .45) 100%)
    }

    .grain {
      position: fixed;
      inset: 0;
      z-index: 9;
      pointer-events: none;
      opacity: .07;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 .6 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")
    }

    .app {
      position: relative;
      z-index: 7;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 12px 9% 22px
    }

    .mute {
      position: fixed;
      left: 50%;
      bottom: 12px;
      transform: translateX(-50%);
      z-index: 20;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      cursor: pointer;
      display: grid;
      place-items: center;
      background: rgba(40, 10, 10, .7);
      border: 1px solid rgba(255, 190, 60, .55);
      color: #ffe3a3;
      backdrop-filter: blur(6px);
      transition: .25s;
      opacity: .75
    }

    .mute:hover {
      opacity: 1;
      box-shadow: 0 0 16px rgba(255, 170, 40, .6)
    }

    .mute svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .mute .x {
      opacity: 0
    }

    .mute[aria-pressed=false] .w {
      opacity: 0
    }

    .mute[aria-pressed=false] .x {
      opacity: 1
    }

    /* lit plaque the blue logo sits on */
    .plate {
      position: relative;
      display: inline-block;
      padding: 12px 52px 8px;
      border-radius: 30px;
      background: linear-gradient(180deg, #fffefa, #fff1d8 70%, #ffe3b4);
      border: 1px solid rgba(255, 214, 140, .95);
      box-shadow: 0 0 0 5px rgba(255, 200, 110, .14), 0 20px 50px rgba(0, 0, 0, .55), 0 0 80px rgba(255, 170, 60, .38), inset 0 -12px 26px rgba(255, 185, 90, .4);
      animation: platein 1.1s .1s cubic-bezier(.2, .8, .2, 1) both
    }

    .plate::before {
      content: "";
      position: absolute;
      inset: 7px;
      border-radius: 24px;
      border: 1px solid rgba(190, 130, 40, .45);
      pointer-events: none
    }

    .plate::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      mix-blend-mode: multiply;
      background: radial-gradient(ellipse at 50% 120%, rgba(255, 150, 40, .35), transparent 60%)
    }

    @keyframes platein {
      from {
        opacity: 0;
        transform: translateY(-24px) scale(.96)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    .hero {
      margin-top: 26px
    }

    .logo {
      margin-top: 0
    }

    .logo::before {
      background: radial-gradient(closest-side, rgba(0, 102, 230, .10), rgba(0, 102, 230, .03) 55%, transparent 75%)
    }

    /* glass module cards */
    .node {
      background: linear-gradient(160deg, rgba(255, 236, 200, .13), rgba(255, 210, 150, .04)), rgba(26, 8, 16, .58);
      backdrop-filter: blur(16px) saturate(1.5);
      border: 1px solid rgba(255, 206, 120, .3);
      box-shadow: 0 18px 40px rgba(0, 0, 0, .5), 0 0 28px color-mix(in srgb, var(--c) 14%, transparent), inset 0 1px 0 rgba(255, 232, 180, .35)
    }

    .node:hover {
      border-color: color-mix(in srgb, var(--c) 60%, rgba(255, 210, 130, .6));
      box-shadow: 0 24px 50px rgba(0, 0, 0, .6), 0 0 46px color-mix(in srgb, var(--c) 34%, transparent), inset 0 1px 0 rgba(255, 232, 180, .5)
    }

    .node.inv {
      background: linear-gradient(160deg, rgba(255, 236, 200, .13), rgba(255, 210, 150, .04)), rgba(26, 8, 16, .58);
      border-color: rgba(255, 206, 120, .3)
    }

    .node .t,
    .node.inv .t {
      color: #fff3de
    }

    .node .d,
    .node.inv .d {
      color: rgba(255, 226, 186, .7)
    }

    .node.ai {
      background: linear-gradient(160deg, color-mix(in srgb, var(--c) 18%, rgba(40, 14, 30, .6)), rgba(26, 8, 16, .58))
    }

    .tagline {
      background: linear-gradient(180deg, rgba(90, 18, 10, .92), rgba(52, 9, 6, .92));
      border-color: rgba(255, 190, 60, .55);
      box-shadow: 0 10px 28px rgba(0, 0, 0, .5), inset 0 1px 0 rgba(255, 220, 150, .3)
    }

    .ico.diya svg {
      animation: flick 3.2s infinite
    }

    .ico.lotus svg {
      animation: breathe 2.4s ease-in-out infinite
    }

    .node:hover .ico.lotus svg {
      animation: flap .5s ease-in-out infinite
    }

    .ico.mandala svg {
      animation: rot 40s linear infinite
    }

    .ico.klantern svg {
      animation: wob 4.5s ease-in-out infinite
    }

    .ico.coin svg {
      animation: floaty 3s ease-in-out infinite
    }

    .ico.matrix::before {
      content: "";
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 1px dashed color-mix(in srgb, var(--c) 50%, transparent);
      background: radial-gradient(circle at 50% 0, var(--c) 0 2.6px, transparent 3.4px);
      animation: rot 9s linear infinite
    }

    .ico.matrix .sp {
      transform-box: fill-box;
      transform-origin: center;
      animation: pulsestar 2.2s ease-in-out infinite
    }

    @keyframes rot {
      to {
        transform: rotate(360deg)
      }
    }

    .hero {
      display: flex;
      flex-direction: column;
      align-items: center
    }

    /* opening sequence: nothing but black until the first cracker bursts */
    body.pre #sky,
    body.pre .skyline,
    body.pre .palace,
    body.pre .haze,
    body.pre #rf,
    body.pre #dy,
    body.pre .garl,
    body.pre .hang {
      opacity: 0
    }

    #sky,
    .skyline,
    .palace,
    .haze,
    #rf,
    #dy,
    .garl,
    .hang {
      transition: opacity 3.4s ease
    }

    body.pre .slot:not(.go) {
      animation: none !important;
      opacity: 0
    }

    body.pre #links {
      opacity: 0
    }

    body.pre .plate:not(.go),
    body.pre .tagline:not(.go) {
      animation: none !important;
      opacity: 0
    }

    body.pre .logo:not(.go),
    body.pre .logo:not(.go) *,
    body.pre .logo:not(.go)::before {
      animation-play-state: paused !important
    }

    /* ---------- hero ---------- */
    .hero {
      flex: none;
      text-align: center;
      margin-top: 18px
    }

    .logo {
      position: relative;
      width: min(460px, 64vw);
      aspect-ratio: 1865/629;
      margin: 2px auto 0;
      animation: logofloat 7s ease-in-out 3s infinite
    }

    .logo::before {
      content: "";
      position: absolute;
      inset: -30% -12%;
      z-index: -1;
      pointer-events: none;
      border-radius: 50%;
      background: radial-gradient(closest-side, rgba(0, 102, 230, .13), rgba(0, 102, 230, .05) 55%, transparent 75%);
      animation: halo 5s ease-in-out infinite
    }

    .logo svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 4px 8px rgba(0, 102, 230, .18));
      animation: logoglow 4.5s ease-in-out 3s infinite
    }

    .logo .arcs {
      transform: translate(calc(var(--lx, 0)*14px), calc(var(--ly, 0)*10px));
      transition: transform .5s cubic-bezier(.2, .8, .2, 1)
    }

    .logo .word {
      transform: translate(calc(var(--lx, 0)*-5px), calc(var(--ly, 0)*-3px));
      transition: transform .5s cubic-bezier(.2, .8, .2, 1)
    }

    .arc {
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: arcdraw 1.5s .15s cubic-bezier(.65, 0, .25, 1) forwards
    }

    .a2 .arc {
      animation-delay: .55s
    }

    .comet {
      stroke-dasharray: .09 .91;
      stroke-dashoffset: .09;
      opacity: 0;
      animation: comet 4.2s 2.2s linear infinite
    }

    .comet.c2 {
      animation-delay: 3.4s;
      animation-direction: normal
    }

    .comet.glow {
      opacity: 0
    }

    .pulses circle {
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
      animation: ripple 3.6s var(--d) ease-out infinite
    }

    .L {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      opacity: 0;
      animation: letterin .9s calc(.55s + var(--i)*.07s) cubic-bezier(.2, 1.2, .3, 1) forwards
    }

    .bob {
      animation: bob 4.8s calc(2.4s + var(--i)*.12s) ease-in-out infinite
    }

    .sheen {
      transform: translateX(-300px) skewX(-18deg);
      animation: sheen 5.5s 2.6s ease-in-out infinite
    }

    @keyframes arcdraw {
      to {
        stroke-dashoffset: 0
      }
    }

    @keyframes comet {
      0% {
        stroke-dashoffset: .09;
        opacity: 0
      }

      6% {
        opacity: 1
      }

      55% {
        opacity: 1
      }

      62% {
        stroke-dashoffset: -1;
        opacity: 0
      }

      100% {
        stroke-dashoffset: -1;
        opacity: 0
      }
    }

    @keyframes ripple {
      0% {
        opacity: .7;
        transform: scale(.6)
      }

      70%,
      100% {
        opacity: 0;
        transform: scale(3.4)
      }
    }

    @keyframes letterin {
      0% {
        opacity: 0;
        transform: translateY(-90px) scale(.7, 1.25);
        filter: blur(10px)
      }

      60% {
        opacity: 1;
        transform: translateY(8px) scale(1.06, .92);
        filter: blur(0)
      }

      80% {
        transform: translateY(-3px) scale(.99, 1.02)
      }

      100% {
        opacity: 1;
        transform: none;
        filter: blur(0)
      }
    }

    @keyframes bob {

      0%,
      100% {
        transform: translateY(0)
      }

      50% {
        transform: translateY(-6px)
      }
    }

    @keyframes sheen {
      0% {
        transform: translateX(-300px) skewX(-18deg)
      }

      45%,
      100% {
        transform: translateX(2150px) skewX(-18deg)
      }
    }

    @keyframes logofloat {

      0%,
      100% {
        transform: translateY(0)
      }

      50% {
        transform: translateY(-4px)
      }
    }

    @keyframes logoglow {

      0%,
      100% {
        filter: drop-shadow(0 4px 8px rgba(0, 102, 230, .15))
      }

      50% {
        filter: drop-shadow(0 6px 18px rgba(0, 102, 230, .3))
      }
    }

    @keyframes halo {

      0%,
      100% {
        opacity: .7;
        transform: scale(1)
      }

      50% {
        opacity: 1;
        transform: scale(1.06)
      }
    }

    .tagline {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 16px;
      margin-top: 10px;
      padding: 10px 28px;
      border-radius: 24px;
      font-family: var(--mono);
      font-size: 13.5px;
      letter-spacing: .34em;
      color: var(--tag-color);
      background: linear-gradient(180deg, rgba(var(--panel-a), .6), rgba(var(--panel-b), .6));
      backdrop-filter: blur(10px);
      border: 1px solid rgba(var(--acc-rgb), .2);
      animation: tagin 1.2s .55s cubic-bezier(.2, .8, .2, 1) both
    }

    .tagline::before {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      padding: 1px;
      pointer-events: none;
      background: conic-gradient(from var(--ang), transparent 0 70%, rgba(var(--acc-rgb), .95) 84%, transparent 96%);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      animation: angspin 7s linear infinite
    }

    .tagline svg {
      width: 13px;
      height: 13px;
      fill: var(--pumpkin);
      filter: drop-shadow(0 0 6px var(--pumpkin));
      animation: twinkle 2.4s ease-in-out infinite
    }

    .tagline svg:last-child {
      animation-delay: -1.2s
    }

    /* ---------- stage ---------- */
    .stagewrap {
      position: relative;
      flex: 1;
      min-height: 0;
      margin: 0 -7%
    }

    .shift {
      position: absolute;
      inset: 0;
      will-change: transform
    }

    #stage {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 1610px;
      height: 470px;
      transform: translate(-50%, -50%) scale(var(--k, 1))
    }

    #links {
      position: absolute;
      inset: -60px;
      width: calc(100% + 120px);
      height: calc(100% + 120px);
      overflow: visible;
      pointer-events: none
    }

    .slot {
      position: absolute;
      width: 285px;
      height: 98px;
      animation: rise 1s var(--d, .8s) cubic-bezier(.2, .9, .25, 1.05) both, bob 7s calc(var(--d, .8s) + 1s) ease-in-out infinite
    }

    .slot:nth-child(odd) {
      animation-duration: 1s, 7s
    }

    .slot:nth-child(even) {
      animation-duration: 1s, 8.5s
    }

    .node {
      position: relative;
      display: flex;
      align-items: center;
      gap: 15px;
      width: 100%;
      height: 100%;
      padding: 0 20px;
      border-radius: 19px;
      cursor: pointer;
      background: linear-gradient(160deg, rgba(var(--card-a), .95), rgba(var(--card-b), .98));
      backdrop-filter: blur(14px) saturate(1.35);
      border: 1px solid color-mix(in srgb, var(--c) 26%, transparent);
      box-shadow: 0 14px 34px rgba(0, 0, 0, .22), 0 0 26px color-mix(in srgb, var(--c) 10%, transparent), inset 0 1px 0 rgba(255, 255, 255, .9);
      transition: transform .18s ease-out, box-shadow .3s, border-color .3s;
      transform-style: preserve-3d;
      will-change: transform
    }

    .node::before {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      padding: 1.5px;
      pointer-events: none;
      background: conic-gradient(from var(--ang), transparent 0 60%, color-mix(in srgb, var(--c) 88%, white) 80%, transparent 93%);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      animation: angspin 6s linear infinite;
      opacity: .9
    }

    .slot:nth-child(2) .node::before {
      animation-duration: 7.5s
    }

    .slot:nth-child(3) .node::before {
      animation-duration: 5.2s
    }

    .slot:nth-child(4) .node::before {
      animation-duration: 8.4s
    }

    .slot:nth-child(5) .node::before {
      animation-duration: 6.6s
    }

    .node:hover {
      border-color: color-mix(in srgb, var(--c) 55%, transparent);
      box-shadow: 0 22px 46px rgba(0, 0, 0, .32), 0 0 44px color-mix(in srgb, var(--c) 30%, transparent), inset 0 1px 0 #fff
    }

    .node:focus-visible {
      outline: 2px solid var(--c);
      outline-offset: 5px
    }

    .spot {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      opacity: 0;
      transition: opacity .3s;
      background: radial-gradient(240px circle at var(--px, 50%) var(--py, 50%), color-mix(in srgb, var(--c) 26%, transparent), transparent 66%)
    }

    .node:hover .spot {
      opacity: 1
    }

    .scan {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      overflow: hidden;
      pointer-events: none
    }

    .scan::after {
      content: "";
      position: absolute;
      left: -30%;
      top: 0;
      bottom: 0;
      width: 30%;
      transform: skewX(-20deg);
      opacity: 0;
      background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--c) 30%, transparent), transparent)
    }

    .node:hover .scan::after {
      animation: scan .9s ease-out
    }

    .corner {
      position: absolute;
      right: 9px;
      bottom: 9px;
      width: 10px;
      height: 10px;
      border-right: 2px solid var(--c);
      border-bottom: 2px solid var(--c);
      border-radius: 0 0 5px 0;
      opacity: .85
    }

    .num {
      position: absolute;
      left: -13px;
      top: -15px;
      width: 31px;
      height: 31px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font: 700 13px var(--mono);
      color: #fff;
      transform: translateZ(30px);
      background: linear-gradient(145deg, color-mix(in srgb, var(--c) 70%, white), var(--c));
      box-shadow: 0 0 18px var(--c), inset 0 -2px 4px rgba(0, 0, 0, .25)
    }

    .num::after {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: 50%;
      border: 1.5px solid var(--c);
      animation: ping 2.6s ease-out infinite
    }

    .slot:nth-child(2) .num::after {
      animation-delay: -.5s
    }

    .slot:nth-child(3) .num::after {
      animation-delay: -1s
    }

    .slot:nth-child(4) .num::after {
      animation-delay: -1.5s
    }

    .slot:nth-child(5) .num::after {
      animation-delay: -2s
    }

    .tag {
      position: absolute;
      right: 14px;
      top: -10px;
      padding: 3px 10px;
      border-radius: 7px;
      transform: translateZ(24px);
      font: 700 10px var(--mono);
      letter-spacing: .07em;
      color: var(--c);
      background: #fff;
      border: 1px solid color-mix(in srgb, var(--c) 50%, transparent);
      box-shadow: 0 0 14px color-mix(in srgb, var(--c) 22%, transparent)
    }

    .ico {
      position: relative;
      flex: none;
      width: 54px;
      height: 54px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      transform: translateZ(18px);
      color: var(--c);
      background: radial-gradient(circle at 30% 22%, color-mix(in srgb, var(--c) 34%, transparent), color-mix(in srgb, var(--c) 7%, transparent) 75%);
      border: 1px solid color-mix(in srgb, var(--c) 42%, transparent);
      box-shadow: inset 0 0 18px color-mix(in srgb, var(--c) 22%, transparent), 0 0 16px color-mix(in srgb, var(--c) 18%, transparent)
    }

    .ico svg {
      width: 29px;
      height: 29px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.55;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 6px var(--c));
      overflow: visible
    }

    .txt {
      min-width: 0;
      transform: translateZ(12px)
    }

    .t {
      display: block;
      font: 700 18px 'Inter', sans-serif;
      color: var(--bone);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: -.005em
    }

    .d {
      display: block;
      margin-top: 4px;
      font-size: 13px;
      color: var(--bone-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    /* icon personalities */
    .ico.diya svg {
      animation: flick 3.2s infinite
    }

    .ico.lotus svg {
      animation: breathe 2.4s ease-in-out infinite
    }

    .node:hover .ico.lotus svg {
      animation: flap .5s ease-in-out infinite
    }

    .ico.mandala svg {
      animation: rot 40s linear infinite
    }

    .ico.klantern svg {
      animation: wob 4.5s ease-in-out infinite
    }

    .ico.coin svg {
      animation: floaty 3s ease-in-out infinite
    }

    .ico.matrix::before {
      content: "";
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 1px dashed color-mix(in srgb, var(--c) 50%, transparent);
      background: radial-gradient(circle at 50% 0, var(--c) 0 2.6px, transparent 3.4px);
      animation: rot 9s linear infinite
    }

    .ico.matrix .sp {
      transform-box: fill-box;
      transform-origin: center;
      animation: pulsestar 2.2s ease-in-out infinite
    }

    .node.ai {
      border: 1px dashed color-mix(in srgb, var(--c) 55%, transparent);
      background: linear-gradient(160deg, color-mix(in srgb, var(--c) 8%, rgba(var(--card-a), .9)), rgba(var(--card-b), .9))
    }

    .node.ai .aura {
      position: absolute;
      inset: -2px;
      border-radius: 21px;
      border: 1px solid var(--c);
      opacity: 0;
      pointer-events: none;
      animation: aura 3.4s ease-out infinite
    }

    .node.ai .aura.b {
      animation-delay: -1.7s
    }

    .num.ai {
      font-size: 11px
    }

    .ripple {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      width: 12px;
      height: 12px;
      margin: -6px 0 0 -6px;
      background: radial-gradient(circle, color-mix(in srgb, var(--c) 80%, white), transparent 70%);
      animation: ripple .8s ease-out forwards
    }

    /* ---------- connectors ---------- */
    .base {
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: draw 1.5s var(--dd) cubic-bezier(.5, 0, .2, 1) forwards
    }

    .glowp {
      fill: none;
      stroke-width: 7;
      stroke-linecap: round;
      filter: url(#blur);
      opacity: 0;
      animation: fadein 1s calc(var(--dd) + 1s) forwards;
      --o: .4
    }

    .flow {
      fill: none;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 1.5 13;
      opacity: 0;
      animation: flow 1.1s linear infinite, fadein 1s calc(var(--dd) + 1.2s) forwards;
      --o: .95
    }

    .port {
      opacity: 0;
      animation: fadein .6s calc(var(--dd) + .9s) forwards;
      --o: 1
    }


    /* =====================================================================
   KEYFRAMES
   ===================================================================== */
    @keyframes rot {
      to {
        transform: rotate(360deg)
      }
    }

    @keyframes angspin {
      to {
        --ang: 360deg
      }
    }

    @keyframes moonpulse {
      50% {
        box-shadow: 0 0 90px 30px rgba(var(--moon-glow), .36), 0 0 270px 115px rgba(var(--moon-glow2), .19)
      }
    }

    @keyframes cloud {
      from {
        transform: translateX(-120%)
      }

      to {
        transform: translateX(260%)
      }
    }

    @keyframes sway {

      0%,
      100% {
        transform: rotate(-.5deg)
      }

      50% {
        transform: rotate(.7deg)
      }
    }

    @keyframes swayr {

      0%,
      100% {
        transform: scaleX(-1) rotate(-.5deg)
      }

      50% {
        transform: scaleX(-1) rotate(.7deg)
      }
    }

    @keyframes fogmove {
      to {
        transform: translateX(9%)
      }
    }

    @keyframes candle {

      0%,
      100% {
        filter: drop-shadow(0 0 22px rgba(var(--acc-rgb), .55))
      }

      30% {
        filter: drop-shadow(0 0 30px rgba(var(--acc-rgb), .75))
      }

      60% {
        filter: drop-shadow(0 0 18px rgba(var(--acc-rgb), .45))
      }
    }

    @keyframes litflick {

      0%,
      100% {
        opacity: 1
      }

      20% {
        opacity: .82
      }

      45% {
        opacity: .96
      }

      70% {
        opacity: .78
      }
    }

    @keyframes spiderdrop {

      0%,
      8% {
        transform: translateY(0)
      }

      38%,
      52% {
        transform: translateY(200px)
      }

      82%,
      100% {
        transform: translateY(0)
      }
    }

    @keyframes slidedown {
      from {
        opacity: 0;
        transform: translateY(-30px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    @keyframes sweepline {

      0%,
      100% {
        opacity: .15
      }

      50% {
        opacity: .7
      }
    }

    @keyframes ping {
      0% {
        transform: scale(1);
        opacity: .7
      }

      100% {
        transform: scale(2.6);
        opacity: 0
      }
    }

    @keyframes blink {
      50% {
        opacity: .2
      }
    }

    @keyframes dashmove {
      to {
        stroke-dashoffset: -760
      }
    }

    @keyframes shimmer {
      0% {
        background-position: 100% 0
      }

      50% {
        background-position: 0% 0
      }

      100% {
        background-position: 100% 0
      }
    }

    @keyframes candlelogo {

      0%,
      100% {
        filter: drop-shadow(0 0 16px rgba(var(--acc-rgb), .28)) drop-shadow(0 0 40px rgba(var(--acc-rgb), .16))
      }

      45% {
        filter: drop-shadow(0 0 22px rgba(var(--acc-rgb), .4)) drop-shadow(0 0 50px rgba(var(--acc-rgb), .22))
      }

      70% {
        filter: drop-shadow(0 0 13px rgba(var(--acc-rgb), .22)) drop-shadow(0 0 34px rgba(var(--acc-rgb), .12))
      }
    }

    @keyframes blurin {
      from {
        opacity: 0;
        filter: blur(18px);
        transform: scale(1.12)
      }

      to {
        opacity: 1
      }
    }

    @keyframes tagin {
      from {
        opacity: 0;
        letter-spacing: .7em
      }

      to {
        opacity: 1;
        letter-spacing: .34em
      }
    }

    @keyframes twinkle {
      50% {
        transform: scale(.55) rotate(45deg);
        opacity: .5
      }
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(46px) scale(.9);
        filter: blur(10px)
      }

      to {
        opacity: 1;
        transform: none;
        filter: blur(0)
      }
    }

    @keyframes bob {
      50% {
        transform: translateY(-4px)
      }
    }

    @keyframes scan {
      from {
        left: -30%;
        opacity: 1
      }

      to {
        left: 120%;
        opacity: 0
      }
    }

    @keyframes flick {

      0%,
      100% {
        filter: drop-shadow(0 0 6px var(--c))
      }

      25% {
        filter: drop-shadow(0 0 11px var(--c))
      }

      55% {
        filter: drop-shadow(0 0 4px var(--c))
      }

      80% {
        filter: drop-shadow(0 0 10px var(--c))
      }
    }

    @keyframes breathe {
      50% {
        transform: scaleY(.88)
      }
    }

    @keyframes flap {

      0%,
      100% {
        transform: scaleY(1)
      }

      50% {
        transform: scaleY(.62)
      }
    }

    @keyframes wob {

      0%,
      100% {
        transform: rotate(-4deg)
      }

      50% {
        transform: rotate(4deg)
      }
    }

    @keyframes floaty {

      0%,
      100% {
        transform: translateY(1.5px)
      }

      50% {
        transform: translateY(-2.5px)
      }
    }

    @keyframes pulsestar {

      0%,
      100% {
        transform: scale(.72);
        opacity: .8
      }

      50% {
        transform: scale(1.2);
        opacity: 1
      }
    }

    @keyframes aura {
      0% {
        opacity: .55;
        transform: scale(1)
      }

      100% {
        opacity: 0;
        transform: scale(1.22, 1.45)
      }
    }

    @keyframes ripple {
      to {
        transform: scale(40);
        opacity: 0
      }
    }

    @keyframes draw {
      to {
        stroke-dashoffset: 0
      }
    }

    @keyframes fadein {
      from {
        opacity: 0
      }

      to {
        opacity: var(--o, 1)
      }
    }

    @keyframes flow {
      to {
        stroke-dashoffset: -29
      }
    }

    @media (prefers-reduced-motion:reduce) {

      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        animation-delay: 0s !important
      }

      .base {
        stroke-dashoffset: 0
      }
    }
  
    /* UNIFIED LUXURY DARK GLASS MODULE CARDS */
    .node, .node.inv {
      background: linear-gradient(160deg, rgba(34, 12, 20, .88), rgba(20, 6, 14, .94)) !important;
      backdrop-filter: blur(14px) saturate(1.35) !important;
      border: 1px solid rgba(255, 214, 140, .35) !important;
      box-shadow: 0 16px 40px rgba(0, 0, 0, .65), 0 0 24px color-mix(in srgb, var(--c) 16%, transparent), inset 0 1px 0 rgba(255, 230, 160, .35) !important;
    }
    .node:hover, .node.inv:hover {
      border-color: color-mix(in srgb, var(--c) 70%, rgba(255, 210, 130, .8)) !important;
      box-shadow: 0 22px 50px rgba(0, 0, 0, .75), 0 0 40px color-mix(in srgb, var(--c) 35%, transparent), inset 0 1px 0 rgba(255, 240, 190, .6) !important;
    }
    .node .t, .node.inv .t, .t {
      color: #fff6e8 !important;
      text-shadow: 0 1px 2px rgba(0, 0, 0, .8) !important;
    }
    .node .d, .node.inv .d, .d {
      color: rgba(255, 230, 195, .8) !important;
    }
    .node.ai {
      background: linear-gradient(160deg, rgba(46, 16, 42, .88), rgba(24, 8, 22, .94)) !important;
      border: 1px dashed color-mix(in srgb, var(--c) 65%, rgba(255, 214, 140, .4)) !important;
    }
    .ico {
      background: radial-gradient(circle at 30% 25%, color-mix(in srgb, var(--c) 30%, transparent), rgba(20, 6, 12, 0.7)) !important;
      border: 1px solid color-mix(in srgb, var(--c) 50%, rgba(255, 214, 140, 0.4)) !important;
    }
    .tag {
      display: none !important;
    }

  </style>

      function finale(detail) {
        if (reduce) return;
        let tapCol = 'gold'; if (detail && detail.c) { COLS.tap = hex2rgb(detail.c); tapCol = 'tap' }
        const pals = [[tapCol, 'gold'], [tapCol, 'white'], ['gold', 'red'], ['pink', tapCol], ['white', 'gold'], [tapCol, 'violet']];
        const types = ['chrys', 'peony', 'willow', 'palm', 'ring', 'cross', 'strobe', 'brocade'];
        setTimeout(() => launch(VW * .5, VH * .2, 'chrys', [tapCol, 'gold'], true), 0);          // grand centre shell
        for (const a of anars) { a.on = 1; a.t = 0; a.len = 4.2; anarSound() }                    // both ground fountains
        const N = 22;
        for (let i = 0; i < N; i++) {
          setTimeout(() => {
            const left = i % 2 === 0, x = left ? rnd(VW * .04, VW * .4) : rnd(VW * .6, VW * .96);
            launch(x, rnd(VH * .08, VH * .5), pick(types), pick(pals), Math.random() < .45);
          }, 250 + i * 135 + rnd(0, 90));
        }
        for (let i = 0; i < 3; i++)setTimeout(() => { for (let k = 0; k < 5; k++)launch(VW * (.12 + k * .19), rnd(VH * .1, VH * .3), 'peony', [tapCol, 'gold'], true) }, 3300 + i * 700);
        nextFw = performance.now() + 8000;
      }
      addEventListener('module:open', e => finale(e.detail));

      /* ---------- marigold garlands ---------- */
      function drawGarland() {
        const h = 190; cv.gl.width = Math.round(VW * DPR); cv.gl.height = Math.round(h * DPR); glx.setTransform(DPR, 0, 0, DPR, 0, 0); glx.clearRect(0, 0, VW, h);
        const leaf = (x, y, a, L) => { glx.save(); glx.translate(x, y); glx.rotate(a); const g = glx.createLinearGradient(0, 0, L, 0); g.addColorStop(0, '#2d7a35'); g.addColorStop(1, '#145021'); glx.fillStyle = g; glx.beginPath(); glx.moveTo(0, 0); glx.quadraticCurveTo(L * .5, -L * .34, L, 0); glx.quadraticCurveTo(L * .5, L * .34, 0, 0); glx.fill(); glx.strokeStyle = 'rgba(180,230,160,.35)'; glx.lineWidth = .7; glx.beginPath(); glx.moveTo(0, 0); glx.lineTo(L * .95, 0); glx.stroke(); glx.restore() };
        const bell = (x, y) => { glx.save(); glx.translate(x, y); const g = glx.createLinearGradient(-6, 0, 6, 0); g.addColorStop(0, '#8a5a12'); g.addColorStop(.45, '#ffe08a'); g.addColorStop(1, '#9a6a18'); glx.fillStyle = g; glx.beginPath(); glx.moveTo(-6, 10); glx.bezierCurveTo(-6, -2, 6, -2, 6, 10); glx.closePath(); glx.fill(); glx.fillStyle = '#d9a441'; glx.beginPath(); glx.arc(0, 11, 2.2, 0, 6.2832); glx.fill(); glx.restore() };
        const segs = 5, segW = VW / segs;
        glx.shadowColor = 'rgba(0,0,0,.45)'; glx.shadowBlur = 7; glx.shadowOffsetY = 3;
        for (let s = 0; s < segs; s++) {
          const x0 = s * segW, sag = 34 + (s % 2) * 8, y0 = 8;
          const P = u => [x0 + u * segW, y0 + sag * 4 * u * (1 - u)];
          const len = segW * 1.12, cnt = Math.round(len / 13);
          for (let i = 0; i <= cnt; i++) {
            const u = i / cnt, [x, y] = P(u);
            if (i % 3 === 1) leaf(x, y, rnd(-.5, .5) + 1.57, 16);
            drawMarigold(glx, x, y, rnd(10, 12.5), rnd(0, 6.28));
          }
          const strands = Math.round(segW / 110);
          for (let k = 1; k <= strands; k++) {
            const u = k / (strands + 1), [x, y] = P(u); if (x > VW * .33 && x < VW * .67) continue;
            const L = rnd(46, 110), m = Math.round(L / 15);
            for (let j = 1; j <= m; j++) { if (j % 2) drawMarigold(glx, x, y + j * 15, 7.5, rnd(0, 6.28)); else leaf(x, y + j * 15 - 5, 1.57 + rnd(-.4, .4), 11) }
            bell(x, y + m * 15 + 10);
          }
        }
        glx.shadowBlur = 0; glx.shadowOffsetY = 0;
      }

      /* ---------- main loop ---------- */
      const fit0 = fit;
      function resize() {
        DPR = Math.min(devicePixelRatio || 1, 1.5); VW = innerWidth; VH = innerHeight; HZ = Math.round(VH * HZF); K = Math.max(.6, Math.min(1.4, VH / 900));
        for (const k of ['sky', 'fw', 'rf', 'dy', 'fx']) { cv[k].width = Math.round(VW * DPR); cv[k].height = Math.round(VH * DPR); cx_[k].setTransform(DPR, 0, 0, DPR, 0, 0) }
        buildSky(); placeDiyas(); drawGarland(); fit(); setTimeout(rebuildStatic, 60); setTimeout(rebuildStatic, 900);
      }
      addEventListener('resize', resize);
      addEventListener('click', e => {
        if (reduce || e.target.closest('.node,.mute')) return;
        launch(e.clientX, Math.min(e.clientY, HZ * .8));
      });
      let last = performance.now();
      function frame(t) {
        const dt = Math.min(.05, (t - last) / 1000); last = t;
        /* sky */
        sx.globalCompositeOperation = 'source-over'; sx.clearRect(0, 0, VW, VH); sx.drawImage(skyBase, 0, 0);
        for (const s of starsDyn) { sx.globalAlpha = Math.max(0, .25 + .75 * Math.sin(t * .001 * s.f + s.p)) * .9; sx.fillStyle = '#fff'; sx.beginPath(); sx.arc(s.x, s.y, s.r, 0, 6.2832); sx.fill() }
        sx.globalAlpha = 1; drawSmoke(dt);
        if (litAmt > .01) { const g = sx.createRadialGradient(VW / 2, HZ, 0, VW / 2, HZ, VW * .7); g.addColorStop(0, `rgba(255,170,90,${(litAmt * .18).toFixed(3)})`); g.addColorStop(1, 'rgba(255,170,90,0)'); sx.fillStyle = g; sx.fillRect(0, 0, VW, HZ) }
        if (!reduce) {
          if (t > nextFw) {
            const side = () => Math.random() < .5 ? rnd(VW * .05, VW * .36) : rnd(VW * .64, VW * .95);
            const x = Math.random() < .78 ? side() : rnd(VW * .38, VW * .62), ty = rnd(VH * .1, VH * .46);
            launch(x, Math.random() < .8 ? ty : rnd(VH * .08, VH * .2));
            if (Math.random() < .45) setTimeout(() => launch(side(), rnd(VH * .1, VH * .46)), 420);
            if (Math.random() < .2) setTimeout(() => launch(side(), rnd(VH * .1, VH * .4)), 900);
            nextFw = t + rnd(2400, 4600);
          }
          updateFw(dt);
        }
        /* light from the bursts onto the scene */
        litAmt *= Math.pow(.9, dt * 60);
        palaceEl.style.setProperty('--lit', litAmt.toFixed(3));
        flashEl.style.opacity = Math.min(.55, litAmt * .9).toFixed(3);
        /* water + diyas + crackers */
        drawWater(t, dt); drawFloaters(t, dt);
        fxx.clearRect(0, 0, VW, VH);
        if (!reduce) updateAnars(t, dt);
        drawSparks(dt);
        if (!reduce) requestAnimationFrame(frame);
      }
      /* ---------- opening sequence: blank screen -> crackers burst the logo, then each module into view ---------- */
      let introDone = false;
      function endIntro() {
        if (introDone) return; introDone = true;
        slots.forEach(sl => { sl.style.setProperty('--d', '0s'); sl.classList.add('go') }); $('.plate').classList.add('go'); $('.tagline').classList.add('go'); $('#logo').classList.add('go');
        buildLinks(false); document.body.classList.remove('pre');
      }
      function intro() {
        const body = document.body;
        if (reduce) { endIntro(); return }
        nextFw = Infinity;
        [...links.children].forEach(c => { if (c.tagName.toLowerCase() !== 'defs') c.remove() });
        const plate = $('.plate'), tag = $('.tagline'), logoEl = $('#logo');
        const ctr = e => { const r = e.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2] };
        const at = (ms, fn) => setTimeout(() => { if (!introDone) fn() }, ms);
        at(900, () => { const [x, y] = ctr(plate); const r = launch(x, y, 'chrys', ['gold', 'white'], true); r.cb = () => { plate.classList.add('go'); logoEl.classList.add('go') } });
        at(1500, () => { const [x, y] = ctr(plate); launch(x - 330, y + 10, 'peony', ['gold', 'orange']); launch(x + 330, y + 10, 'peony', ['gold', 'orange']) });
        at(3000, () => { const [x, y] = ctr(plate); const r = launch(x, y + 110, 'ring', ['gold', 'white']); r.cb = () => tag.classList.add('go') });
        const T0 = 4300, GAP = 900;
        slots.forEach((sl, i) => {
          at(T0 + i * GAP, () => {
            const [x, y] = ctr(sl); COLS['n' + i] = hex2rgb(nodes[i].c);
            const r = launch(x, y, i === 5 ? 'chrys' : 'peony', ['n' + i, 'white'], i === 5);
            r.cb = () => { sl.style.setProperty('--d', '0s'); sl.classList.add('go') };
          })
        });
        const Tend = T0 + slots.length * GAP + 1400;
        const shown = () => slots.every(sl => sl.classList.contains('go')) && plate.classList.contains('go') && tag.classList.contains('go');
        at(Tend, () => { let tries = 0; const wait = () => { if (introDone) return; if (shown() || ++tries > 20) { endIntro(); finale({ c: '#ffb347' }); nextFw = performance.now() + 9000 } else setTimeout(wait, 300) }; wait() });
      }
      addEventListener('keydown', e => { if (e.key === 'Escape' && !introDone) { endIntro(); nextFw = performance.now() + 2500 } });
      resize();
      if (reduce) { frame(performance.now()) } else { requestAnimationFrame(frame) }
      intro();
    })();

  </script>
</body>
